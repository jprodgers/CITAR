about = """
The war switch. A bot set to go to war as soon as it can (every threshold at nothing, the war chance
at one) prepares a war on a neighbour whose city it can reach and declares it in the same turn. When
the seat's model owns war the bot neither prepares nor declares one, but it still fights the war its
model declares.
"""
from = "tests/test_bot_diplomacy.py::WarSwitchTests::test_the_bot_never_declares_war_but_fights_the_war_it_is_given"
needs = "2-05"

[[step]]
set = { eager = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 1, war_chance_aggr = 0, war_min_turn = 0, war_power_ratio = 0, war_power_ratio_aggr = 0, war_max_threat = 100, declare_ratio = 0, declare_ratio_aggr = 0, war_need_min = 1, war_need_max = 1, war_need_base = 1, prep_gather = false } }

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true, pop = 3 },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A>e>e" },
  { op = "found_city", player = 1, at = "B", capital = true, pop = 3 },
  { op = "add_unit", player = 1, unit = "Warrior", at = "B" },
  { op = "meet", a = 0, b = 1 },
  { op = "reveal", player = 0 },
]

[[step]]
bot = "turn"
player = 0
aggression = 1
params = "=eager"

[[step]]
check = { what = "relation", a = 0, b = 1 }
subset = { war = true, war_declared_by = 0 }

[[step]]
check = { what = "events", type = "war_declared" }
len = 1

[[step]]
note = "With war the model's, the same bot declares nothing."
new_game = {}

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true, pop = 3 },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A>e>e" },
  { op = "found_city", player = 1, at = "B", capital = true, pop = 3 },
  { op = "add_unit", player = 1, unit = "Warrior", at = "B" },
  { op = "meet", a = 0, b = 1 },
  { op = "reveal", player = 0 },
]

[[step]]
repeat = 2
steps = [
  { bot = "turn", player = 0, aggression = 1, params = "=eager", diplomacy = { war = "llm" } },
  { op = "end_turn", args = { player = 1 } },
]

[[step]]
check = { what = "relation", a = 0, b = 1 }
path = "war"
eq = false

[[step]]
check = { what = "events", type = "war_declared" }
len = 0

[[step]]
note = "The model declares war; the bot fights it: it attacks a wounded warrior beside one of its own."
ops = [
  { op = "add_unit", player = 0, unit = "Warrior", x = 12, y = 8 },
  { op = "add_unit", player = 1, unit = "Warrior", x = 13, y = 8, hp = 30 },
]

[[step]]
tool = "declare_war"
player = 0
args = { player_id = 1 }

[[step]]
bot = "turn"
player = 0
aggression = 1
params = "=eager"
diplomacy = { war = "llm" }

[[step]]
check = { what = "events", type = "combat" }
len = 1

[[step]]
check = { what = "events", type = "combat" }
path = "[0].text"
matches = "^Civilization 1's Warrior attacked"
