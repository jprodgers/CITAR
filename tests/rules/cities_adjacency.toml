about = """
A tile's yield reads its neighbours: a Moai gives a culture more for each Moai next to it. So an
improvement built next to a tile a city works changes where its citizens should work, even on a
tile beyond the city's reach that nobody owns, and they move to the better tile.

The Rust engine moves them at once, as after any change to what a city's tiles yield; Python
moved them at the end of the city's turn (intended: citizens-follow-a-neighbour-at-once).
"""
from = "citar/engine/tiles.py: _extra_improvement_stats; citar/engine/cities.py: rank_stats_for_work"

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", name = "Roma", pop = 1, claim_radius = 3 },
  { op = "add_unit", player = 1, unit = "Warrior", at = "B" },
]
as = "made"

[[step]]
set = { city = "=made[0].city_id" }

[[step]]
note = "two Moai next to each other, both three tiles from Roma"
ops = [
  { op = "set_tile", at = "(8,5)", improvement = "Moai" },
  { op = "set_tile", at = "(8,6)", improvement = "Moai" },
]

[[step]]
tool = "set_city_focus"
args = { city_id = "=city", focus = "culture" }
as = "culture"

[[step]]
note = "the two yield alike, and the tie goes to the larger row"
check = "culture"
path = "worked_tiles"
eq = [[8, 6]]

[[step]]
check = { what = "tile", at = "(9,5)" }
path = "owner"
is_null = true

[[step]]
note = "a third Moai four tiles from Roma, next to (8,5) and not to (8,6)"
op = "set_tile"
args = { at = "(9,5)", improvement = "Moai" }

[[step]]
check = { what = "city", city = "=city" }
path = "worked"
eq = [[8, 5]]
intended = "citizens-follow-a-neighbour-at-once"

[[step]]
note = "Python's citizens move at the end of the city's turn"
op = "end_round"

[[step]]
check = { what = "city", city = "=city" }
path = "worked"
eq = [[8, 5]]
