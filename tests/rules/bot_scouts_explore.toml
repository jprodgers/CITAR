about = """
The bot keeps its scouts exploring. A scout with nothing left to explore sleeps, or is disbanded
once the game is past scout_disband_turn (or its owner is at its unit supply).
"""
from = "citar/bots/basic.py:2054-2063 (handle_scout)"
needs = "2-01b"

[[step]]
set = { calm = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0 } }

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "add_unit", player = 0, unit = "Scout", at = "A>e" },
  { op = "found_city", player = 1, at = "B", capital = true },
]

[[step]]
check = { what = "player", player = 0 }
path = "explored"
absent = false
as = "explored"

[[step]]
check = { what = "units", player = 0 }
path = "[type=Scout].id"
absent = false
as = "scout"

[[step]]
bot = "turn"
player = 0
params = "=calm"

[[step]]
check = { what = "unit", unit = "=scout" }
path = "activity"
eq = "explore"

[[step]]
check = { what = "player", player = 0 }
path = "explored"
gt = "=explored"

[[step]]
note = "With the whole map known there is nothing to explore: the scout sleeps."
ops = [{ op = "reveal", player = 0 }]

[[step]]
op = "end_turn"
args = { player = 1 }

[[step]]
bot = "turn"
player = 0
params = "=calm"

[[step]]
check = { what = "unit", unit = "=scout" }
path = "activity"
eq = "sleep"

[[step]]
note = "Late in the game it is disbanded instead."
op = "end_turn"
args = { player = 1 }

[[step]]
op = "set_turn"
args = { turn = 61 }

[[step]]
op = "ready_unit"
args = { unit = "=scout" }

[[step]]
bot = "turn"
player = 0
params = "=calm"

[[step]]
check = { what = "units", player = 0 }
none = { path = "type", eq = "Scout" }
