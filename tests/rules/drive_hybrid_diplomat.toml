about = """
A hybrid seat's driver plays its turn, then the drive stops so the host can run the seat's language
model for its diplomacy (plan H1); the turn is still the seat's. Driving on ends it, even from a
save taken at the stop; so does the host ending it itself. A seat handed to another controller is
driven by what it has become.
"""
from = "crates/citar-engine/src/game/turn/drive.rs (plan-0.1.6 6.1: HybridAgent)"

[config]
players = [{ controller = "hybrid" }, { controller = "bot" }]

[[step]]
ops = [
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "add_unit", player = 1, unit = "Warrior", at = "B" },
]

[[step]]
op = "drive"
args = { drivers = [0, 1] }
as = "stop"

[[step]]
check = "stop"
eq = { stop = "hybrid_diplomat", player = 0, negotiations = [], turn = 1, current = 0 }

[[step]]
note = "The diplomat acts on the seat's turn."
tool = "write_notes"
player = 0
args = { text = "The diplomat was here." }

[[step]]
note = "The host saves the game at the stop and plays on from the save, which keeps where the drive stopped."
op = "reload"

[[step]]
note = "Driving on ends the hybrid seat's turn without playing it again; the bot's turn follows, and the hybrid seat's next."
op = "drive"
args = { drivers = [0, 1] }
as = "stop"

[[step]]
check = "stop"
eq = { stop = "hybrid_diplomat", player = 0, negotiations = [], turn = 2, current = 0 }

[[step]]
note = "The host may end the turn itself."
op = "end_turn"
as = "after"

[[step]]
check = "after"
eq = { turn = 2, current = 1 }

[[step]]
note = "Handed to the bot, the seat is driven through."
op = "set_controller"
args = { player = 0, controller = "bot" }

[[step]]
op = "drive"
args = { drivers = [0, 1], seat_limit = 2 }
as = "stop"

[[step]]
check = "stop"
eq = { stop = "seat_limit", player = "=null", negotiations = [], turn = 3, current = 1 }
