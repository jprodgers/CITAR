about = """
The bot uses its great people: a great scientist hurries research where it stands, a great artist
spends itself on its triggered ability (a golden age), and a great engineer with nothing to hurry
walks next to the capital and builds its great improvement there.
"""
from = "citar/bots/basic.py:1951-2037 (handle_special)"
needs = "2-03"

[[step]]
set = { calm = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0 } }

[[step]]
note = "The control: two turns of research without a scientist."
ops = [
  { op = "found_city", player = 0, at = "A", capital = true, pop = 3 },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "set_research", player = 0, tech = "Pottery" },
  { op = "found_city", player = 1, at = "B", capital = true },
]

[[step]]
repeat = 2
steps = [
  { bot = "turn", player = 0, params = "=calm" },
  { op = "end_turn", args = { player = 1 } },
]

[[step]]
check = { what = "player", player = 0 }
path = "research.progress.Pottery"
gt = 0
as = "plain"

[[step]]
note = "A scientist is worth the science of the turns before it: it arrives after the first."
new_game = {}

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true, pop = 3 },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "set_research", player = 0, tech = "Pottery" },
  { op = "found_city", player = 1, at = "B", capital = true },
]

[[step]]
bot = "turn"
player = 0
params = "=calm"

[[step]]
op = "end_turn"
args = { player = 1 }

[[step]]
op = "add_unit"
args = { player = 0, unit = "Great Scientist", at = "A" }

[[step]]
bot = "turn"
player = 0
params = "=calm"

[[step]]
op = "end_turn"
args = { player = 1 }

[[step]]
check = { what = "units", player = 0 }
none = { path = "type", eq = "Great Scientist" }

[[step]]
note = "The scientist's science came on top of the turns'."
check = { what = "player", player = 0 }
path = "research.progress.Pottery"
gt = "=plain"

[[step]]
note = "A great artist starts a golden age."
new_game = {}

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true, pop = 3 },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "add_unit", player = 0, unit = "Great Artist", at = "A" },
  { op = "found_city", player = 1, at = "B", capital = true },
]

[[step]]
check = { what = "great_people", player = 0 }
path = "golden_age_turns"
eq = 0

[[step]]
bot = "turn"
player = 0
params = "=calm"

[[step]]
check = { what = "units", player = 0 }
none = { path = "type", eq = "Great Artist" }

[[step]]
check = { what = "great_people", player = 0 }
path = "golden_age_turns"
gt = 0

[[step]]
note = "A great engineer in a capital that builds nothing builds a manufactory beside it."
new_game = {}

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true, pop = 3 },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "add_unit", player = 0, unit = "Great Engineer", at = "A" },
  { op = "found_city", player = 1, at = "B", capital = true },
]

[[step]]
bot = "turn"
player = 0
params = "=calm"

[[step]]
check = { what = "units", player = 0 }
any = { path = "type", eq = "Great Engineer" }

[[step]]
op = "end_turn"
args = { player = 1 }

[[step]]
bot = "turn"
player = 0
params = "=calm"

[[step]]
check = { what = "units", player = 0 }
none = { path = "type", eq = "Great Engineer" }

[[step]]
check = { what = "find_tiles", at = "A", radius = 1, improvement = "Manufactory" }
len = 1
