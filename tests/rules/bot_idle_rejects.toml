about = """
The idle bot founds its capital with its settler, moves nothing else, and rejects every negotiation
put to it, whatever is on the table.
"""
from = "citar/bots/idle.py"

[[step]]
ops = [
  { op = "add_unit", player = 0, unit = "Settler", at = "A" },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A>e>e" },
  { op = "add_unit", player = 1, unit = "Warrior", at = "B" },
  { op = "found_city", player = 1, at = "B", capital = true },
  { op = "meet", a = 0, b = 1 },
  { op = "set_player", player = "all", gold = 100 },
]

[[step]]
bot = "turn"
player = 0
version = "idle"
as = "after"

[[step]]
check = "after"
eq = { turn = 1, current = 1 }

[[step]]
note = "The settler founded the capital where it stood."
check = { what = "player", player = 0 }
path = "cities"
len = 1

[[step]]
check = { what = "tile", at = "A" }
path = "city"
is_null = false

[[step]]
note = "The warrior did not move."
check = { what = "units", player = 0 }
path = "[0]"
subset = { type = "Warrior", x = "=x('A>e>e')", y = "=y('A>e>e')" }

[[step]]
check = { what = "units", player = 0 }
len = 1

[[step]]
note = "A generous offer is rejected all the same."
op = "open_negotiation_as"
args = { player = 1, to = 0, message = "A gift.", give = [{ type = "gold", amount = 50 }] }
as = "gift"

[[step]]
bot = "respond"
player = 0
version = "idle"
negotiation = "=gift.negotiation_id"
as = "answered"

[[step]]
check = "answered"
eq = { outcome = "done" }

[[step]]
check = { what = "negotiation", negotiation = "=gift.negotiation_id" }
subset = { status = "rejected", awaiting = "=null" }

[[step]]
check = { what = "negotiation", negotiation = "=gift.negotiation_id" }
path = "history[1]"
subset = { by = 0, action = "reject", message = "We are not interested." }

[[step]]
note = "So is talk."
op = "open_negotiation_as"
args = { player = 1, to = 0, message = "Hello." }
as = "talk"

[[step]]
bot = "respond"
player = 0
version = "idle"
negotiation = "=talk.negotiation_id"

[[step]]
check = { what = "negotiation", negotiation = "=talk.negotiation_id" }
path = "status"
eq = "rejected"

[[step]]
note = "On its next turn it does nothing: no unit is bought or built."
op = "end_turn"
args = { player = 1 }

[[step]]
bot = "turn"
player = 0
version = "idle"

[[step]]
check = { what = "units", player = 0 }
len = 1
