about = """
A worker ordered to build a road on its tile queues it, and the road is laid once the worker has
done the work at the end of its turns. An enemy military unit pillages the road, and the owner is
told; the road stays pillaged until a worker repairs it, which takes less time than building it.
A worker cannot build what it has no tech for, and a civilian cannot pillage.
"""
from = "tests/test_mechanics.py::WorkerTests::test_build_road_pillage_and_repair"

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", name = "Roma" },
  { op = "found_city", player = 1, at = "B", name = "Antium" },
  { op = "add_unit", player = 0, unit = "Worker", at = "A>e" },
]
as = "made"

[[step]]
set = { worker = "=made[2].unit_ids[0]" }

[[step]]
op = "ready_unit"
args = { unit = "=worker" }

[[step]]
note = "The Wheel is not known yet."
tool = "build_improvement"
args = { unit_id = "=worker", improvement = "Road" }
error = "Road requires The Wheel."

[[step]]
op = "grant_tech"
args = { player = 0, tech = "The Wheel" }

[[step]]
check = { what = "build_options", unit = "=worker" }
any = { path = "name", eq = "Road" }

[[step]]
tool = "build_improvement"
args = { unit_id = "=worker", improvement = "road" }
as = "order"

[[step]]
check = "order"
subset = { building = "Road", queue = ["Road"] }

[[step]]
check = { what = "unit", unit = "=worker" }
path = "activity"
eq = "build"

[[step]]
check = { what = "tile", at = "A>e" }
path = "builds"
eq = [["Road", "=order.turns"]]

[[step]]
note = "One turn of work short of the road."
op = "progress_builds"
args = { player = 0, turns = "=order.turns - 1" }

[[step]]
check = { what = "tile", at = "A>e" }
subset = { route = "=null", builds = [["Road", 1]] }

[[step]]
op = "progress_builds"
args = { player = 0 }

[[step]]
check = { what = "tile", at = "A>e" }
subset = { route = "Road", route_pillaged = false, builds = [] }

[[step]]
note = "The road done, the worker has no order left."
check = { what = "unit", unit = "=worker" }
path = "activity"
is_null = true

[[step]]
check = { what = "events", type = "improvement_built" }
path = "[0]"
subset = { text = "Civilization 1 finished Road.", audience = [0] }

[[step]]
note = "A civilian cannot pillage."
tool = "unit_order"
args = { unit_id = "=worker", order = "pillage" }
error = "Civilian units cannot pillage."

[[step]]
ops = [
  { op = "remove_units", unit = "=worker" },
  { op = "meet", a = 0, b = 1 },
  { op = "set_relation", a = 0, b = 1, state = "war" },
  { op = "add_unit", player = 1, unit = "Warrior", at = "A>e" },
]
as = "war"

[[step]]
set = { raider = "=war[3].unit_ids[0]" }

[[step]]
op = "force_turn"
args = { player = 1 }

[[step]]
op = "ready_unit"
args = { unit = "=raider" }
as = "raider_ready"

[[step]]
tool = "unit_order"
player = 1
args = { unit_id = "=raider", order = "pillage" }
as = "pillaged"

[[step]]
check = "pillaged"
eq = { pillaged = "Road", loot = {}, healed = 0 }

[[step]]
check = { what = "tile", at = "A>e" }
subset = { route = "Road", route_pillaged = true }

[[step]]
note = "Pillaging costs the raider a movement point."
check = { what = "unit", unit = "=raider" }
path = "moves"
eq = "=raider_ready.moves - 60"

[[step]]
check = { what = "events", type = "pillaged" }
path = "[0]"
subset = { text = "An enemy Warrior has pillaged our Road.", audience = [0, 1] }

[[step]]
note = "Nothing is left to pillage."
tool = "unit_order"
player = 1
args = { unit_id = "=raider", order = "pillage" }
error = "There is nothing here to pillage."

[[step]]
ops = [
  { op = "remove_units", unit = "=raider" },
  { op = "add_unit", player = 0, unit = "Worker", at = "A>e" },
]
as = "back"

[[step]]
set = { mender = "=back[1].unit_ids[0]" }

[[step]]
op = "force_turn"
args = { player = 0 }

[[step]]
op = "ready_unit"
args = { unit = "=mender" }

[[step]]
check = { what = "build_options", unit = "=mender" }
path = "[0]"
subset = { name = "Repair" }

[[step]]
tool = "build_improvement"
args = { unit_id = "=mender", improvement = "repair" }
as = "repair"

[[step]]
check = "repair"
subset = { building = "Repair", queue = ["Repair"] }

[[step]]
note = "A repair is quicker than the road it mends."
check = "repair"
path = "turns"
lt = "=order.turns"

[[step]]
op = "progress_builds"
args = { player = 0, turns = "=repair.turns" }

[[step]]
check = { what = "tile", at = "A>e" }
subset = { route = "Road", route_pillaged = false, builds = [] }
