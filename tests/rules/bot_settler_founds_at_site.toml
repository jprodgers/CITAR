about = """
A settler walks to the best expansion site it knows (a tile's worth as a city, less the distance from
the bot's cities) and founds the city there once it arrives, rather than where it stands. Wine,
incense, wheat and cattle make one site the clear best.
"""
from = "citar/bots/basic.py:1069-1111 (expansion_sites), 1835-1857 and 1879-1888 (handle_settler)"
needs = "2-01b"

[[step]]
set = { calm = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0 } }

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "add_unit", player = 0, unit = "Settler", at = "A" },
  { op = "found_city", player = 1, at = "B", capital = true },
  { op = "reveal", player = 0 },
  { op = "set_tile", x = 10, y = 4, resource = "Wine" },
  { op = "set_tile", x = 9, y = 4, resource = "Incense" },
  { op = "set_tile", x = 10, y = 6, resource = "Wheat" },
  { op = "set_tile", x = 8, y = 6, resource = "Cattle" },
]

[[step]]
note = "The settler sets out: it founds nothing where it stands."
bot = "turn"
player = 0
params = "=calm"

[[step]]
check = { what = "player", player = 0 }
path = "cities"
len = 1

[[step]]
check = { what = "units", player = 0 }
any = { path = "type", eq = "Settler" }

[[step]]
op = "end_turn"
args = { player = 1 }

[[step]]
repeat = 2
steps = [
  { bot = "turn", player = 0, params = "=calm" },
  { op = "end_turn", args = { player = 1 } },
]

[[step]]
check = { what = "player", player = 0 }
path = "cities"
len = 2

[[step]]
check = { what = "tile", x = 9, y = 4 }
path = "owner"
eq = 0

[[step]]
check = { what = "tile", x = 9, y = 4 }
path = "city"
is_null = false

[[step]]
check = { what = "units", player = 0 }
none = { path = "type", eq = "Settler" }
