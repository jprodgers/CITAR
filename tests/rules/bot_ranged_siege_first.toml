about = """
At war, the bot aims its army at an enemy city and, once the army has gathered, its ranged units
close to firing range and bombard the city first: they act before the melee units, which do not throw
themselves at a city still at full strength.
"""
from = "citar/bots/basic.py:1776 (ranged units first), 2156-2172 and 2212-2231 (handle_military), 2291-2339 (_war_target)"

[[step]]
set = { calm = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0 } }

[[step]]
note = "Two garrisoned cities; a warrior and two archers four tiles from the enemy capital at B."
ops = [
  { op = "found_city", player = 0, at = "A", capital = true },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "found_city", player = 0, x = 12, y = 10 },
  { op = "add_unit", player = 0, unit = "Warrior", x = 12, y = 10 },
  { op = "found_city", player = 1, at = "B", capital = true },
  { op = "meet", a = 0, b = 1 },
  { op = "set_relation", a = 0, b = 1, state = "war" },
  { op = "grant_tech", player = 0, tech = "Archery" },
  { op = "add_unit", player = 0, unit = "Warrior", x = 14, y = 10 },
  { op = "add_unit", player = 0, unit = "Archer", x = 14, y = 9 },
  { op = "add_unit", player = 0, unit = "Archer", x = 14, y = 11 },
  { op = "reveal", player = 0 },
]
as = "made"

[[step]]
set = { target = "=made[4].city_id" }

[[step]]
check = { what = "city", city = "=target" }
path = "max_health"
gt = 0
as = "full"

[[step]]
check = { what = "city", city = "=target" }
path = "health"
eq = "=full"

[[step]]
note = "The first turn closes the distance: nothing is in range yet."
bot = "turn"
player = 0
params = "=calm"

[[step]]
check = { what = "events", type = "combat" }
len = 0

[[step]]
op = "end_turn"
args = { player = 1 }

[[step]]
note = "The second turn the archers fire on the city; the warrior holds."
bot = "turn"
player = 0
params = "=calm"

[[step]]
check = { what = "events", type = "combat" }
len = 2

[[step]]
check = { what = "events", type = "combat" }
none = { path = "text", not_contains = "Archer attacked" }

[[step]]
check = { what = "city", city = "=target" }
path = "health"
lt = "=full"

[[step]]
check = { what = "city", city = "=target" }
path = "owner"
eq = 1
