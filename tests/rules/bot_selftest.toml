about = """
The bot step itself: a seat's bot plays its turn and ends it, answers a negotiation that waits on
the seat (or leaves it to the seat's model), and the runners refuse a bot step that is not well
formed. A turn step must pin the bot's draws, and its params must be parameters of basic-1. A turn
that a negotiation the seat's model owns keeps open cannot end, and both runners say why in
end_turn's words.
"""
from = "tests/rules/README.md (the bot step)"

[[step]]
set = { calm = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0 } }

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true },
  { op = "found_city", player = 1, at = "B", capital = true },
  { op = "meet", a = 0, b = 1 },
  { op = "set_player", player = "all", gold = 100 },
]

[[step]]
note = "A turn is played on the seat's own turn only."
bot = "turn"
player = 1
params = "=calm"
error = true

[[step]]
note = "A turn ends the seat's turn: the next major's begins."
bot = "turn"
player = 0
params = "=calm"
as = "after"

[[step]]
check = "after"
eq = { turn = 1, current = 1 }

[[step]]
bot = "turn"
player = 1
version = "idle"
as = "after"

[[step]]
check = "after"
eq = { turn = 2, current = 0 }

[[step]]
note = "A turn whose params leave a draw free is refused."
bot = "turn"
player = 0
params = { tech_noise = 0 }
must_fail = "pins its draws"

[[step]]
bot = "turn"
player = 0
params = { tech_noise = 0.1, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0 }
must_fail = "tech_noise is 0"

[[step]]
bot = "turn"
player = 0
params = { tech_noise = 0, ranged_chance = 0.5, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0 }
must_fail = "ranged_chance is 0 or 1"

[[step]]
bot = "turn"
player = 0
params = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 1, friend_chance_aggr = 0.3, war_chance = 0, war_chance_aggr = 0 }
must_fail = "friend_chance_aggr is 0"

[[step]]
bot = "turn"
player = 0
params = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 1, war_chance_aggr = 0, war_prep_rate = 0.5 }
must_fail = "war_prep_rate keeps the war chance 0 or at least 1"

[[step]]
note = "Params are basic-1's: a key it does not have is refused, the cache parameters it dropped too."
bot = "turn"
player = 0
params = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0, site_cache_turns = 2 }
must_fail = "site_cache_turns is not a parameter of basic-1"

[[step]]
note = "A number typed as a string is refused, as everywhere in a script."
bot = "turn"
player = 0
params = { tech_noise = "0", ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0 }
must_fail = "typed as a string"

[[step]]
bot = "turn"
player = 0
version = "basic-2"
params = "=calm"
must_fail = "version is one of"

[[step]]
note = "The idle bot has no parameters, no switches and no advice."
bot = "turn"
player = 0
version = "idle"
params = { tech_noise = 0 }
must_fail = "the idle bot takes no params"

[[step]]
bot = "advice"
player = 0
version = "idle"
must_fail = "the idle bot gives no advice"

[[step]]
bot = "play"
player = 0
must_fail = "bot is one of"

[[step]]
bot = "turn"
params = "=calm"
must_fail = "names its player"

[[step]]
bot = "respond"
player = 0
must_fail = "names its negotiation"

[[step]]
bot = "advice"
player = 0
diplomacy = { trade = "llm" }
must_fail = "diplomacy"

[[step]]
note = """
What the seat's language model owns, its bot leaves to it, and such a negotiation keeps the turn
from ending: the step fails with the reason end_turn gives, which names first the one that waits
on the seat.
"""
op = "open_negotiation_as"
args = { player = 1, to = 0, message = "Gold for maps?", give = [{ type = "share_map" }], receive = [{ type = "gold", amount = 10 }] }
as = "asked"

[[step]]
bot = "turn"
player = 0
params = "=calm"
diplomacy = { trades = "llm" }
must_fail = "the bot's turn did not end: Answer Civilization 2 in negotiation #1 first: respond_negotiation(negotiation_id=1, action='accept', 'counter', 'reply' or 'reject', message=...). You cannot end your turn while a negotiation waits on you."

[[step]]
check = { what = "negotiation", negotiation = "=asked.negotiation_id" }
subset = { status = "open", awaiting = 0 }

[[step]]
tool = "respond_negotiation"
player = 0
args = { negotiation_id = "=asked.negotiation_id", action = "reject", message = "Another time." }

[[step]]
note = "The bot's turns above may have spent the gold the next offer gives."
ops = [{ op = "set_player", player = 0, gold = 100 }]

[[step]]
tool = "open_negotiation"
player = 0
args = { to = 1, message = "Maps for gold?", give = [{ type = "gold", amount = 10 }], receive = [{ type = "share_map" }] }
as = "opened"

[[step]]
note = "One the seat has put to a seat nobody drives holds the turn too, while the model owns it."
bot = "turn"
player = 0
params = "=calm"
diplomacy = { trades = "llm" }
must_fail = "the bot's turn did not end: You are waiting for Civilization 2 to answer negotiation #2. End your turn after they reply, or withdraw it with respond_negotiation(negotiation_id=2, action='reject', message=...)."

[[step]]
check = { what = "negotiation", negotiation = "=opened.negotiation_id" }
subset = { status = "open", awaiting = 1 }

[[step]]
note = "A negotiation that waits on another seat is not the bot's to answer."
bot = "respond"
player = 0
negotiation = "=opened.negotiation_id"
error = "Negotiation 2 does not wait on player 0."

[[step]]
bot = "respond"
player = 1
negotiation = 99
error = "No negotiation with id 99."

[[step]]
note = "One that waits on the seat is answered."
bot = "respond"
player = 1
negotiation = "=opened.negotiation_id"
as = "answered"

[[step]]
check = "answered"
eq = { outcome = "done" }

[[step]]
check = { what = "negotiation", negotiation = "=opened.negotiation_id" }
path = "history"
len = 2

[[step]]
check = { what = "negotiation", negotiation = "=opened.negotiation_id" }
path = "history[1].by"
eq = 1

[[step]]
note = "Answered, it waits on the seat no longer: settled, or countered and waiting on the other side."
bot = "respond"
player = 1
negotiation = "=opened.negotiation_id"
error = "Negotiation 2 does not wait on player 1."
