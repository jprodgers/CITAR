about = """
A land unit in one of the bot's cities is its garrison and fortifies there. A healthy unit outside goes
to the nearest city with no garrison, within garrison_radius, and fortifies in it. A wounded unit with
no empty city near heals where it stands.
"""
from = "citar/bots/basic.py:1774-1775 (manage_units' garrisons), 2141-2198 (handle_military)"

[[step]]
set = { calm = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0 } }

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true },
  { op = "found_city", player = 0, at = "D" },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "add_unit", player = 0, unit = "Warrior", at = "D>ne>ne" },
  { op = "add_unit", player = 0, unit = "Warrior", at = "H", hp = 30 },
  { op = "found_city", player = 1, at = "B", capital = true },
]

[[step]]
check = { what = "units", player = 0, at = "H" }
path = "[0].id"
absent = false
as = "wounded"

[[step]]
bot = "turn"
player = 0
params = "=calm"

[[step]]
check = { what = "units", player = 0, at = "A" }
path = "[0]"
subset = { type = "Warrior", activity = "fortify" }

[[step]]
check = { what = "units", player = 0, at = "D" }
path = "[0]"
subset = { type = "Warrior", activity = "fortify" }

[[step]]
check = { what = "unit", unit = "=wounded" }
subset = { x = "=x('H')", y = "=y('H')", activity = "heal" }

[[step]]
check = { what = "units", player = 0, at = "D>ne>ne" }
len = 0
