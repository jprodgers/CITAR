about = """
The espionage switch. While the bot owns espionage it sends an idle spy to a rival capital it knows
(here the only one); when the seat's model owns espionage the spy stays in its hideout.
"""
from = "citar/bots/basic.py:1040-1064 (empire_choices, _spies)"

[[step]]
set = { calm = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0 } }

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true, pop = 3 },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "found_city", player = 1, at = "B", capital = true, pop = 3 },
  { op = "add_unit", player = 1, unit = "Warrior", at = "B" },
  { op = "meet", a = 0, b = 1 },
  { op = "reveal", player = 0 },
]
as = "made"

[[step]]
op = "add_spy"
args = { player = 0 }

[[step]]
bot = "turn"
player = 0
params = "=calm"

[[step]]
check = { what = "spies", player = 0 }
path = "[0]"
subset = { city = "=made[2].city_id" }

[[step]]
check = { what = "spies", player = 0 }
path = "[0].action"
ne = "None"

[[step]]
note = "With espionage the model's, the spy stays home."
new_game = {}

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true, pop = 3 },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "found_city", player = 1, at = "B", capital = true, pop = 3 },
  { op = "add_unit", player = 1, unit = "Warrior", at = "B" },
  { op = "meet", a = 0, b = 1 },
  { op = "reveal", player = 0 },
]

[[step]]
op = "add_spy"
args = { player = 0 }

[[step]]
bot = "turn"
player = 0
params = "=calm"
diplomacy = { espionage = "llm" }

[[step]]
check = { what = "spies", player = 0 }
path = "[0]"
subset = { city = "=null", action = "None" }
