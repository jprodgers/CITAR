about = """
A city in danger (the enemies near it outweigh its defence) with no unit in it buys a defender with
gold, preferring a ranged unit, on the bot's turn; the bot also sets a defender as its production.
"""
from = "citar/bots/basic.py:1591-1606 (manage_gold), 869-871 (in_danger)"
needs = "2-01b"

[[step]]
set = { calm = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0 } }

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true },
  { op = "found_city", player = 1, at = "B", capital = true },
  { op = "grant_tech", player = 0, tech = "Archery" },
  { op = "set_player", player = 0, gold = 500 },
  { op = "meet", a = 0, b = 1 },
  { op = "set_relation", a = 0, b = 1, state = "war" },
  { op = "add_unit", player = 1, unit = "Spearman", at = "A>e" },
  { op = "add_unit", player = 1, unit = "Spearman", at = "A>w" },
  { op = "add_unit", player = 1, unit = "Warrior", at = "A>ne" },
]

[[step]]
check = { what = "units", player = 0 }
len = 0

[[step]]
bot = "turn"
player = 0
params = "=calm"

[[step]]
note = "An archer stands in the city, bought: the gold paid for it."
check = { what = "units", player = 0 }
len = 1

[[step]]
check = { what = "units", player = 0 }
path = "[0]"
subset = { type = "Archer", x = "=x('A')", y = "=y('A')" }

[[step]]
check = { what = "player", player = 0 }
path = "gold"
lt = 400
