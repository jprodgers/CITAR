about = """
Experience buys promotions: ten points for the first, twenty for the second. A promotion must be
one the unit's type may take; Heal Instantly heals fifty health and is not kept.
"""
from = "tests/test_mechanics.py::test_upgrade_and_promotion; citar/engine/units.py: promote, add_promotion"

[[step]]
op = "add_unit"
args = { player = 0, unit = "Warrior", at = "D" }
as = "added"

[[step]]
set = { w = "=added.unit_ids[0]" }

[[step]]
tool = "promote_unit"
args = { unit_id = "=w", promotion = "Shock I" }
error = "Not enough XP (0/10)."

[[step]]
op = "set_unit"
args = { unit = "=w", xp = 15 }

[[step]]
tool = "promote_unit"
args = { unit_id = "=w", promotion = "shock i" }
as = "promoted"

[[step]]
check = "promoted"
eq = { promotions = ["Shock I"] }

[[step]]
check = { what = "unit", unit = "=w" }
subset = { xp = 5, promotions = ["Shock I"] }

[[step]]
tool = "promote_unit"
args = { unit_id = "=w", promotion = "Drill I" }
error = "Not enough XP (5/20)."

[[step]]
tool = "promote_unit"
args = { unit_id = "=w", promotion = "Accuracy I" }
error = "Accuracy I is not available for this unit. Available:"

[[step]]
op = "set_unit"
args = { unit = "=w", xp = 20, hp = 40 }

[[step]]
tool = "promote_unit"
args = { unit_id = "=w", promotion = "Heal Instantly" }

[[step]]
check = { what = "unit", unit = "=w" }
subset = { hp = 90, xp = 0, promotions = ["Shock I"] }
