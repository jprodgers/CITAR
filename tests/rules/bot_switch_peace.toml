about = """
The peace switch. While the bot owns peace it offers peace in a long war (or one it is losing) once
peace_min_turns have passed; when the seat's model owns peace it offers none, and the war goes on.
"""
from = "citar/bots/basic.py:2415-2430 (consider_diplomacy)"
needs = "2-05"

[[step]]
set = { peaceful = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 1, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0 } }

[[step]]
note = "A war since turn 1, and it is turn 40: a long war."
ops = [
  { op = "found_city", player = 0, at = "A", capital = true, pop = 3 },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "found_city", player = 1, at = "B", capital = true, pop = 3 },
  { op = "add_unit", player = 1, unit = "Warrior", at = "B" },
  { op = "meet", a = 0, b = 1 },
  { op = "set_relation", a = 0, b = 1, state = "war" },
]

[[step]]
op = "set_turn"
args = { turn = 40 }

[[step]]
bot = "turn"
player = 0
params = "=peaceful"

[[step]]
check = { what = "negotiation", negotiation = 1 }
subset = { initiator = 0, responder = 1 }

[[step]]
check = { what = "negotiation", negotiation = 1 }
path = 'history[0].proposal["0"]'
eq = [{ type = "peace_treaty" }]

[[step]]
note = "With peace the model's, no offer: the war goes on."
new_game = {}

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true, pop = 3 },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "found_city", player = 1, at = "B", capital = true, pop = 3 },
  { op = "add_unit", player = 1, unit = "Warrior", at = "B" },
  { op = "meet", a = 0, b = 1 },
  { op = "set_relation", a = 0, b = 1, state = "war" },
]

[[step]]
op = "set_turn"
args = { turn = 40 }

[[step]]
bot = "turn"
player = 0
params = "=peaceful"
diplomacy = { peace = "llm" }

[[step]]
check = { what = "events", type = "negotiation" }
len = 0

[[step]]
check = { what = "relation", a = 0, b = 1 }
path = "war"
eq = true
