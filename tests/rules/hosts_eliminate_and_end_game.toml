about = """
The test operations that stand in for the Python tests' pokes of a player's alive and the game's
phase: eliminate ends the civilization's turn first if it is its turn, takes its cities and units,
and eliminates it as a defeat does, the last civilization standing winning; end_game ends the game
won by a civilization, by a victory or by none, or with no winner.
"""
from = "tests/test_benchmarks.py, test_worker.py, test_access.py, test_session.py: their pokes of the Python engine's game"

[config]
players = [{}, {}, {}]

[[step]]
ops = [
  { op = "found_city", player = 1, at = "A", name = "Carthago" },
  { op = "add_unit", player = 0, unit = "Warrior", at = "B" },
  { op = "add_unit", player = 1, unit = "Warrior", at = "C" },
  { op = "add_unit", player = 2, unit = "Warrior", at = "E" },
]

[[step]]
note = "it is player 0's turn: the turn ends first, so the game keeps a living player whose turn it is"
op = "eliminate"
args = { player = 0 }
as = "gone"

[[step]]
check = "gone"
eq = { turn = 1, current = 1, phase = "playing", winner = "=null", victory = "=null", eliminated = 0 }

[[step]]
check = { what = "player", player = 0 }
subset = { alive = false, units = [], cities = [] }

[[step]]
check = { what = "events", type = "eliminated" }
path = "[0].text"
eq = "Civilization 1 has been destroyed!"

[[step]]
op = "eliminate"
args = { player = 0 }
error = "has been eliminated already"

[[step]]
note = "a civilization with a city loses it and is eliminated; the last one standing wins"
op = "eliminate"
args = { player = 1 }
as = "last"

[[step]]
check = "last"
eq = { turn = 1, current = 2, phase = "over", winner = 2, victory = "Domination", eliminated = 1 }

[[step]]
check = { what = "player", player = 1 }
subset = { alive = false, units = [], cities = [] }

[[step]]
new_game = {}

[[step]]
op = "end_game"
args = { victory = "Time" }
error = "A victory needs a winner."

[[step]]
op = "end_game"
args = { winner = 1, victory = "time" }
as = "won"

[[step]]
check = "won"
eq = { turn = 1, current = 0, phase = "over", winner = 1, victory = "Time" }

[[step]]
check = { what = "events", type = "victory" }
len = 1

[[step]]
op = "end_game"
error = "The game is over."

[[step]]
note = "a winner with no victory named wins with none, as Triggers victory does"
new_game = {}

[[step]]
op = "end_game"
args = { winner = 0 }
as = "neutral"

[[step]]
check = "neutral"
subset = { phase = "over", winner = 0, victory = "Neutral" }

[[step]]
new_game = {}

[[step]]
op = "end_game"
as = "ended"

[[step]]
check = "ended"
eq = { turn = 1, current = 0, phase = "over", winner = "=null", victory = "=null" }

[[step]]
check = { what = "events", type = "game_over" }
path = "[0].text"
eq = "The game has been ended with no winner."
