about = """
A worker clears a forest: the nearest city of its civilization within five tiles gets the forest's
production, scaled by the speed and by the distance beyond one tile, and is told; a farm then goes
on the cleared tile. A farm ordered on a forest itself queues the forest's removal first, its turns
counting both (Rust only: Python never offered it, intended). A tile with nothing left to build
leaves the worker without an order.
"""
from = "tests/test_mechanics.py::WorkerTests::test_forest_needs_removal_before_farm"

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", name = "Roma" },
  { op = "found_city", player = 1, at = "B", name = "Antium" },
  { op = "grant_tech", player = 0, techs = ["Agriculture", "Mining"] },
]
as = "made"

[[step]]
set = { roma = "=made[0].city_id" }

[[step]]
note = "Roma's borders reach the forest two tiles west."
op = "set_city"
args = { city = "=roma", claim_radius = 2 }

[[step]]
check = { what = "tile", at = "F" }
subset = { features = ["Forest"], owner = 0, city = "=roma" }

[[step]]
op = "add_unit"
args = { player = 0, unit = "Worker", at = "F" }
as = "added"

[[step]]
set = { worker = "=added.unit_ids[0]" }

[[step]]
op = "ready_unit"
args = { unit = "=worker" }

[[step]]
check = { what = "build_options", unit = "=worker" }
any = { subset = { name = "Remove Forest" } }

[[step]]
tool = "build_improvement"
args = { unit_id = "=worker", improvement = "Remove Forest" }
as = "chop"

[[step]]
check = "chop"
subset = { building = "Remove Forest", queue = ["Remove Forest"] }

[[step]]
op = "progress_builds"
args = { player = 0, turns = "=chop.turns" }

[[step]]
check = { what = "tile", at = "F" }
subset = { features = [], improvement = "=null", builds = [] }

[[step]]
check = { what = "events", type = "chop" }
path = "[0]"
subset = { audience = [0] }

[[step]]
check = { what = "events", type = "chop" }
path = "[0].text"
matches = "^Clearing a Forest has created [0-9]+ production for Roma[.]$"

[[step]]
note = "Roma builds nothing, so the production waits as overflow."
check = { what = "city", city = "=roma" }
path = "overflow"
gt = 0

[[step]]
tool = "build_improvement"
args = { unit_id = "=worker", improvement = "Farm" }
as = "farm"

[[step]]
check = "farm"
subset = { building = "Farm", queue = ["Farm"] }

[[step]]
op = "progress_builds"
args = { player = 0, turns = "=farm.turns" }

[[step]]
check = { what = "tile", at = "F" }
subset = { improvement = "Farm", pillaged = false, builds = [] }

[[step]]
check = { what = "unit", unit = "=worker" }
path = "activity"
is_null = true

[[step]]
note = "What is built is not offered again."
check = { what = "build_options", unit = "=worker" }
none = { path = "name", eq = "Farm" }

[[step]]
note = "A forest next to Roma, and the worker on it."
op = "set_tile"
args = { at = "A>w", features = ["Forest"] }

[[step]]
op = "set_unit"
args = { unit = "=worker", at = "A>w" }

[[step]]
op = "ready_unit"
args = { unit = "=worker" }

[[step]]
intended = "improvements-over-removable-features"
check = { what = "build_options", unit = "=worker" }
any = { subset = { name = "Farm", first_removes = "Forest" } }

[[step]]
intended = "improvements-over-removable-features"
tool = "build_improvement"
args = { unit_id = "=worker", improvement = "Farm" }
as = "both"

[[step]]
intended = "improvements-over-removable-features"
check = "both"
subset = { building = "Farm", queue = ["Remove Forest", "Farm"], turns = "=chop.turns + farm.turns" }

[[step]]
intended = "improvements-over-removable-features"
op = "progress_builds"
args = { player = 0, turns = "=chop.turns" }

[[step]]
intended = "improvements-over-removable-features"
note = "One tile away, the chop's production is not scaled."
check = { what = "events", type = "chop" }
len = 2

[[step]]
intended = "improvements-over-removable-features"
check = { what = "tile", at = "A>w" }
subset = { features = [], builds = [["Farm", "=farm.turns"]] }

[[step]]
intended = "improvements-over-removable-features"
op = "progress_builds"
args = { player = 0, turns = "=farm.turns" }

[[step]]
intended = "improvements-over-removable-features"
check = { what = "tile", at = "A>w" }
subset = { improvement = "Farm", builds = [] }
