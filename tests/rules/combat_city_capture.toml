about = """
A melee unit takes a city whose defences are down: the city becomes a puppet of its conqueror, loses
a citizen, resists for as many turns as it has citizens left, stands at half health, and hands over
the civilians in it; the conqueror plunders gold and moves in, and the loser thinks worse of it. Its
conqueror may then raze it, stop razing it, keep it a puppet or annex it; a city one founded may be
none of these, and an original capital is never razed.
"""
from = "tests/test_mechanics.py::CaptureTests::test_capture_city_and_domination, test_puppet_annex_and_raze_rules; citar/engine/conquest.py"

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", name = "Roma" },
  { op = "found_city", player = 1, at = "C", name = "Enemyton" },
  { op = "found_city", player = 1, at = "B", name = "Frontier", pop = 3 },
  { op = "add_unit", player = 0, unit = "Warrior", at = "B>w" },
  { op = "add_unit", player = 1, unit = "Worker", at = "B" },
  { op = "set_player", player = 0, gold = 0 },
  { op = "set_relation", a = 0, b = 1, state = "war" },
]
as = "made"

[[step]]
set = { roma = "=made[0].city_id", frontier = "=made[2].city_id", w = "=made[3].unit_ids[0]" }

[[step]]
op = "set_turn"
args = { turn = 20 }

[[step]]
op = "set_city"
args = { city = "=frontier", health = 1 }

[[step]]
check = { what = "preview", unit = "=w", at = "B" }
subset = { defender = "Frontier", defender_hp = 1, defender_strength = 1.0, target = "city", note = "City defenses are down: a melee attack will capture it." }

[[step]]
tool = "attack"
args = { unit_id = "=w", at = "B" }
as = "fight"

[[step]]
check = "fight"
subset = { captured_city = "Frontier", from = "Civilization 2", result = "puppet" }

[[step]]
check = { what = "city", city = "=frontier" }
subset = { owner = 0, founder = 1, previous_owner = 1, puppet = true, razing = false, pop = 2, resistance = 2, queue = [] }
as = "taken"

[[step]]
check = "taken"
path = "health"
eq = "=taken.max_health // 2"

[[step]]
check = { what = "unit", unit = "=w" }
subset = { x = 18, y = 10, owner = 0, xp = 0 }

[[step]]
check = { what = "units", at = "B" }
any = { subset = { owner = 0, type = "Worker" } }

[[step]]
check = { what = "units", player = 1 }
len = 0

[[step]]
check = { what = "player", player = 0 }
path = "gold"
eq = "=fight.gold_plundered"

[[step]]
check = { what = "relation", a = 0, b = 1 }
path = "opinion[1]"
eq = -85

[[step]]
check = { what = "events", type = "city_captured" }
len = 1

[[step]]
note = "what its conqueror may do with it"
tool = "city_status"
args = { city_id = "=frontier", status = "raze" }
as = "razed"

[[step]]
check = "razed"
eq = { razing = "Frontier", turns = 2 }

[[step]]
check = { what = "city", city = "=frontier" }
subset = { razing = true, puppet = false }

[[step]]
tool = "city_status"
args = { city_id = "=frontier", status = "stop_razing" }
as = "stopped"

[[step]]
check = "stopped"
eq = { stopped_razing = "Frontier" }

[[step]]
tool = "city_status"
args = { city_id = "=frontier", status = "annex" }
error = "Frontier is not a puppet."

[[step]]
tool = "city_status"
args = { city_id = "=frontier", status = "puppet" }
as = "pup"

[[step]]
check = "pup"
eq = { puppet = "Frontier" }

[[step]]
tool = "city_status"
args = { city_id = "=frontier", status = "annex" }
as = "annexed"

[[step]]
check = "annexed"
eq = { annexed = "Frontier" }

[[step]]
check = { what = "city", city = "=frontier" }
subset = { puppet = false, razing = false, owner = 0 }

[[step]]
note = "a city one founded"
tool = "city_status"
args = { city_id = "=roma", status = "raze" }
error = "Roma cannot be razed (original capitals and holy cities cannot be razed)."

[[step]]
tool = "city_status"
args = { city_id = "=roma", status = "annex" }
error = "Roma is not a puppet."

[[step]]
tool = "city_status"
args = { city_id = "=roma", status = "puppet" }
error = "You cannot make a puppet of a city you founded."

[[step]]
tool = "city_status"
args = { city_id = "=roma", status = "liberate" }
error = "Only cities captured from another civilization can be liberated."

[[step]]
tool = "city_status"
args = { city_id = "=roma", status = "burn" }
error = "status must be annex, puppet, raze, stop_razing or liberate."
