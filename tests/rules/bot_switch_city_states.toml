about = """
The city-states switch. While the bot owns city-states and has gold to spare it gifts gold to a
city-state it knows (the classic gift: cs_gift_amount once over cs_gift_gold), and gains influence;
when the seat's model owns city-states it gifts nothing.
"""
from = "citar/bots/basic.py:1640-1657 (manage_gold, _court_city_states)"

[config]
city_states = 1

[[step]]
set = { calm = { tech_noise = 0, ranged_chance = 0, peace_offer_chance = 0, friend_chance = 0, friend_chance_aggr = 0, war_chance = 0, war_chance_aggr = 0 } }

[[step]]
note = "The city-state is player 2; it gets a city at its start."
ops = [
  { op = "found_city", player = 0, at = "A", capital = true, pop = 3 },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "found_city", player = 1, at = "B", capital = true, pop = 3 },
  { op = "add_unit", player = 1, unit = "Warrior", at = "B" },
  { op = "found_city", player = 2, at = "CS", capital = true },
  { op = "meet", a = 0, b = 2 },
  { op = "set_player", player = 0, gold = 700 },
]

[[step]]
check = { what = "city_state", player = 2 }
path = 'influence["0"]'
eq = 0

[[step]]
bot = "turn"
player = 0
params = "=calm"

[[step]]
check = { what = "city_state", player = 2 }
path = 'influence["0"]'
gt = 0

[[step]]
check = { what = "player", player = 0 }
path = "gold"
lt = 500

[[step]]
note = "With city-states the model's, no gift."
new_game = {}

[[step]]
ops = [
  { op = "found_city", player = 0, at = "A", capital = true, pop = 3 },
  { op = "add_unit", player = 0, unit = "Warrior", at = "A" },
  { op = "found_city", player = 1, at = "B", capital = true, pop = 3 },
  { op = "add_unit", player = 1, unit = "Warrior", at = "B" },
  { op = "found_city", player = 2, at = "CS", capital = true },
  { op = "meet", a = 0, b = 2 },
  { op = "set_player", player = 0, gold = 700 },
]

[[step]]
bot = "turn"
player = 0
params = "=calm"
diplomacy = { city_states = "llm" }

[[step]]
check = { what = "city_state", player = 2 }
path = 'influence["0"]'
eq = 0

[[step]]
check = { what = "player", player = 0 }
path = "gold"
ge = 700
