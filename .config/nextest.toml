# cargo nextest profiles. `default` is the laptop; `ci` is what rust.yml runs.

[profile.default]
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

# Whole-game tests that play several games on threads of their own count as that many test
# threads, so that nextest does not run them over each other: the bots' war games and fixture
# sweep fill every core, and the economy games (five games, and two) ran past their 300 s when
# they shared the cores (package 2-03). Every profile reads the default profile's overrides.
[[profile.default.overrides]]
filter = 'binary_id(citar-testkit::bot) & test(/^bot::(war|sweep)::/)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'binary_id(citar-testkit::bot) & test(/^bot::economy::four_bots/)'
threads-required = 5

[[profile.default.overrides]]
filter = 'binary_id(citar-testkit::bot) & test(/^bot::economy::a_bot_game_saved/)'
threads-required = 2

[[profile.default.overrides]]
filter = 'binary_id(citar-testkit::bot) & test(/^bot::diplomacy::a_bot_game_saved/)'
threads-required = 2

# The job host's limit tests (citar-jobs' `host` binary, 4-08) start hosts under CPU and memory
# limits: one at a time, so that together they stay within the laptop's bounds (at most two cores'
# worth and 512 MB, design/phase4-helper.md P4.7.1), and the CPU test alone on the machine, so
# that its host gets the share it was given.
[test-groups]
job-host = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(citar-jobs::host) & test(=limits::cpu_is_held_to_its_share)'
test-group = 'job-host'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'binary_id(citar-jobs::host)'
test-group = 'job-host'

[profile.ci]
# No retries: a test that passes on a second try is a determinism bug, not a flake.
retries = 0
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.nightly]
# nightly.yml: the properties at 10,000 cases, whose two game properties take tens of minutes
# each. Long tests are reported every 5 minutes and stopped after 100.
retries = 0
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "300s", terminate-after = 20 }
