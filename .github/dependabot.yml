# Dependency updates.
#
# Weekly rather than daily: CITAR has a small dependency surface and a stream of individual bumps
# is noise. Grouped into one pull request per ecosystem for the same reason - the question worth
# answering is "does everything still work together", which is one test run, not twelve.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
    labels: ["dependencies"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      rust:
        patterns: ["*"]
    ignore:
      # libm is pinned exactly and bumped by hand: a bump can change the last bit of a result,
      # so it comes with re-blessed goldens (crates/citar-engine/DESIGN.md 2.6 and 7.5).
      - dependency-name: "libm"
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The Dockerfile's base is pinned by digest, which this moves weekly; its Python stays the VPS's, 3.12, so the
      # image and the server's deploy run one interpreter (design/phase5-release.md P5.7): moved by hand, with both.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels: ["dependencies", "docker"]
