# Build and publish a release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Everything below is derived from that tag. The jobs run in an order that matters: the Python
# package is published first because every other install route installs *from* PyPI, and the
# GitHub release is created last because the Homebrew, Scoop and winget manifests point at the
# files attached to it.
#
# PyPI publishing uses trusted publishing (OpenID Connect), so there is no API token in this
# repository's secrets. It has to be configured once, at
# https://pypi.org/manage/project/citar/settings/publishing/, naming this repository, the workflow
# file `release.yml` and the environment `pypi`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (a dry run; nothing is published)"
        required: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------- checks
  verify:
    name: tests must pass first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Release packaging is Phase 5
        # Every job below needs this one, so nothing is built or published past this step. 0.1.6
        # builds the package with its Rust extension (maturin, crates/citar-engine/DESIGN.md
        # P2.6.7), and these jobs do not know how yet: one wheel for every platform from a Linux
        # runner, a Windows bundle and a helper without the extension, an image built from the
        # source. Phase 5 rebuilds them (a maturin wheel per platform, the image from wheels) and
        # removes this step. Until then it fails every run, a tag's or a dry run's, while
        # __version__ is 0.1.6 or earlier: 0.1.5 is what the branch carries until its release
        # bumps it.
        run: |
          python3 - <<'PY'
          import re, sys
          text = open("citar/__init__.py", encoding="utf-8").read()
          version = re.search(r'^__version__ = "([^"]+)"', text, re.M).group(1)
          release = tuple(int(n) for n in re.match(r"(\d+)\.(\d+)\.(\d+)", version).groups())
          if release <= (0, 1, 6):
              print("::error::release packaging is Phase 5")
              print(f"__version__ is {version}: this workflow cannot package the Rust engine yet, and "
                    "Phase 5 replaces it (crates/citar-engine/DESIGN.md P2.6.8)")
              sys.exit(1)
          print(f"__version__ is {version}, past 0.1.6")
          PY

      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[all]"
      - run: python -m unittest discover -s tests
      - run: python scripts/audit_routes.py --strict

      - name: The tag matches the version in the source
        # A tag that disagrees with citar/__init__.py produces a release whose artifacts all report
        # a different version from the one people downloaded.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          source="$(python -c 'import citar; print(citar.__version__)')"
          if [ "$tag" != "$source" ]; then
            echo "::error::tag v$tag does not match citar.__version__ ($source)"
            exit 1
          fi
          echo "v$tag matches the source"

      - name: The changelog has an entry for this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          grep -q "## \[\?$tag\]\?" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for $tag"
            exit 1
          }

  # ---------------------------------------------------------------------------------- python
  build-python:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*

  publish-pypi:
    needs: build-python
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing; no token in secrets
    steps:
      - uses: actions/download-artifact@v8
        with: { name: python-package, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------------------------- windows
  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pyinstaller pillow

      - name: Icon
        run: python installer/make_icon.py

      - name: Bundle
        run: python -m PyInstaller installer/citar.spec --noconfirm --distpath dist --workpath build

      - name: The bundle runs
        # Catches a missing hidden import, which PyInstaller reports as a clean build and a
        # program that dies on first launch.
        run: |
          dist\CITAR\citar.exe --version
          dist\CITAR\citar.exe where
          dist\CITAR\citar.exe doctor --quiet

      - name: Version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.value }} installer\citar.iss

      - name: Portable zip
        # For Scoop, and for anyone who would rather not run an installer at all.
        shell: bash
        run: |
          cd dist
          7z a -tzip "CITAR-${{ steps.version.outputs.value }}-windows-x64.zip" CITAR >/dev/null
          sha256sum "CITAR-${{ steps.version.outputs.value }}-windows-x64.zip" \
            | cut -d' ' -f1 > "CITAR-${{ steps.version.outputs.value }}-windows-x64.zip.sha256"

      - name: Checksum the installer
        shell: bash
        run: |
          cd installer/output
          sha256sum *.exe | cut -d' ' -f1 > "CITAR-${{ steps.version.outputs.value }}-setup.exe.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            installer/output/*.exe
            installer/output/*.sha256
            dist/*.zip
            dist/*.sha256

  # ---------------------------------------------------------------------------------- the helper
  # The CITAR helper (crates/citar-helper, the Rust binary that replaced the Python worker in 0.1.6): what someone
  # downloads onto the machine with the GPU (design/phase4-helper.md P4.10, 4-14). One build per target, under the
  # five names the server's download links use (citar/web/js/helperrules.js; citar/web/tests/helper.test.mjs holds the
  # matrix's `asset:` entries, one line a target, equal to them and to cargo xtask helper-manifest's), with no version
  # in the name: the links point at releases/latest/download/<name>, which then always gives the newest build. Each
  # has its .sha256 beside it and is run once here (--version names its target; --self-test runs the job host's
  # canary and self-check). No features: a test feature, the development guard and the package managers' `packaged`
  # never reach these builds (cargo xtask check reads every line of this file). The Linux builds are glibc-based on
  # ubuntu-22.04, so they run on older distributions; rustls with the OS's own verifier means TLS does not depend on
  # where a distribution keeps its CA bundle (checked on Fedora below).
  build-helper:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: citar-helper-windows-x64.exe }
          - { os: macos-15, target: aarch64-apple-darwin, asset: citar-helper-macos-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, asset: citar-helper-macos-x64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: citar-helper-linux-x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: citar-helper-linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        # rust-toolchain.toml pins the exact release; the target is the runner's own
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked -p citar-helper --target ${{ matrix.target }}
          mkdir -p dist
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/citar-helper$ext" "dist/${{ matrix.asset }}"

      - name: The helper runs, on its target, and computes as every other build does
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.asset }}" || true
          version="$(./dist/${{ matrix.asset }} --version)"
          echo "$version"
          case "$version" in
            *"target ${{ matrix.target }},"*) ;;
            *) echo "::error::the build does not name its target ${{ matrix.target }}"; exit 1 ;;
          esac
          ./dist/${{ matrix.asset }} --self-test
          ./dist/${{ matrix.asset }} --help > /dev/null

      - name: TLS works on a distribution that keeps its certificates elsewhere
        # The helper verifies servers with the OS's own trust store (rustls-platform-verifier), so a distribution
        # that keeps its CA roots elsewhere than the build machine (Fedora; 0.1.1's Python helper failed every
        # handshake there) must still connect. Any answer from the server is fine here (a refusal is expected); a
        # certificate error is not.
        if: matrix.os == 'ubuntu-22.04'
        run: |
          out=$(docker run --rm -v "$PWD/dist:/d" fedora:latest timeout 15 /d/${{ matrix.asset }} \
                --server https://github.com --token x --no-hardware --base-url http://127.0.0.1:9/v1 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qi "certificate"; then exit 1; fi

      - name: Checksum
        shell: bash
        run: |
          cd dist && (sha256sum "${{ matrix.asset }}" 2>/dev/null || shasum -a 256 "${{ matrix.asset }}") \
            | cut -d' ' -f1 > "${{ matrix.asset }}.sha256"
          cat "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------------- the helper's manifest
  # What helpers update themselves from (design/phase4-helper.md P4.3.8, P4.10): citar-helper-manifest.json over
  # the binaries above (cargo xtask helper-manifest, the build read from the Linux one, which runs here), signed by
  # cargo xtask sign-manifest with the update-signing key, which lives only in this job's environment: the protected
  # environment helper-signing (a required reviewer approves every run), as its secret CITAR_UPDATE_SIGNING_KEY,
  # read from the environment and never written to disk. The owner's one-time setup is docs/server/WORKERS.md,
  # "Signing helper updates". Without the secret nothing is signed and the job says so and succeeds: the release's
  # helpers, whose update-keys.pub then trusts no key either, report updates unavailable.
  sign-helper-manifest:
    needs: build-helper
    runs-on: ubuntu-latest
    environment: helper-signing
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        # rust-toolchain.toml pins the exact release
        run: rustup toolchain install

      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: citar-helper-*
          merge-multiple: true

      - name: The manifest
        shell: bash
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          chmod +x assets/citar-helper-linux-x64 || true
          cargo xtask helper-manifest --assets assets --version "$version"

      - name: Signed, when the environment holds the key
        shell: bash
        env:
          CITAR_UPDATE_SIGNING_KEY: ${{ secrets.CITAR_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$CITAR_UPDATE_SIGNING_KEY" ]; then
            echo "::notice::helper-signing holds no CITAR_UPDATE_SIGNING_KEY: the manifest is not signed, and this release's helpers report updates unavailable"
            exit 0
          fi
          cargo xtask sign-manifest --key-env CITAR_UPDATE_SIGNING_KEY assets/citar-helper-manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: citar-helper-manifest
          path: |
            assets/citar-helper-manifest.json
            assets/citar-helper-manifest.json.sig
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------- container
  publish-image:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/citar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 is here for the Raspberry Pi and Apple silicon cases; it builds under emulation
          # and is the slowest step in the release.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------------- release
  github-release:
    needs: [build-python, build-windows, build-helper, sign-helper-manifest]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: artifacts }

      - name: Collect the assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.whl' \
            -o -name '*.tar.gz' -o -name '*.sha256' -o -name 'citar-helper-*' \) -exec cp {} release/ \;
          ls -la release

      - name: Notes for this version
        # The section of CHANGELOG.md for this tag, so the release page and the changelog cannot
        # disagree.
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "---" >> notes.md
          echo "" >> notes.md
          echo "### Checksums" >> notes.md
          echo '```' >> notes.md
          (cd release && sha256sum *.exe *.zip *.whl *.tar.gz citar-helper-macos-* citar-helper-linux-* 2>/dev/null || true) >> notes.md
          echo '```' >> notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
