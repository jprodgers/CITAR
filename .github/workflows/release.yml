# Build and publish a release: being rebuilt in Phase 5 (design/phase5-release.md).
#
# Until package 5-09 writes it whole (P5.11), this workflow is only its gate: one job that fails every run, a tag's
# or a dry run's, with the notice below. It builds nothing, publishes nothing and names no environment, so nothing a
# tag or a dispatch starts here can reach PyPI, the registry, the release page or the update-signing key while the
# release's builds move to package.yml (5-02b to 5-08) and the tag-only publishing jobs are written (5-09). The
# triggers stay as the release keeps them: a pushed `v*` tag, and a dispatch with the version (a dry run).
#
# scripts/ci/check_workflows.py (test.yml's lint job) holds this file to P5.17's rules on every pull request: no
# build step, no publishing job outside the tag guard, no environment but those the rules allow, every action pinned.
# cargo xtask check still reads every line of it (no helper test feature may be named here, design/phase4-helper.md
# P4.3.1).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (a dry run; nothing is published)"
        required: true

permissions:
  contents: read

jobs:
  phase-5:
    name: release packaging is Phase 5
    runs-on: ubuntu-latest
    steps:
      - name: The release workflow is being rebuilt (design/phase5-release.md P5.11, package 5-09)
        # Nothing follows this job: a tag or a dry run stops here, before any build, with the reason.
        run: |
          echo "::error title=release packaging is Phase 5::this workflow is reduced to its gate until package 5-09 writes it (design/phase5-release.md P5.11): every release build moves to package.yml, and the tag-only publishing jobs come with 5-09"
          exit 1
