# Publish the documentation.
#
# The Markdown in docs/ is the source of truth, and it is reviewable in a pull request like any
# other change. This workflow turns it into the two places people actually read it:
#
#   * a searchable site at https://jprodgers.github.io/CITAR
#   * the repository's GitHub wiki, which is its own git repository and cannot be updated by a
#     normal push to this one
#
# Both are derived, never edited by hand. An edit made directly in the wiki is overwritten by the
# next run, which is why every generated page says so at the bottom.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "citar/**/*.py"          # the API reference is generated from docstrings
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }

      - name: Install
        # The package itself is installed because mkdocstrings imports the modules it documents.
        run: pip install -e ".[dev]"

      - name: Build
        run: mkdocs build --strict

      - uses: actions/configure-pages@v6
        # `enablement` switches the repository's Pages source to GitHub Actions. Without it the
        # action only *reads* the Pages configuration, and a repository whose Pages is still set to
        # "deploy from a branch" - which is what a freshly enabled one is - fails the whole job with
        # "Get Pages site failed". It is idempotent: on every later run the setting already matches.
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v5

  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      - name: Generate the wiki pages
        run: python scripts/build_wiki.py

      - name: Push them to the wiki repository
        # A wiki is a separate git repository, and GITHUB_TOKEN cannot write to it. Nor can a
        # fine-grained personal access token - wikis are not among the permissions those can
        # grant - so WIKI_TOKEN has to be a *classic* token with the `repo` scope.
        #
        # Without it this job says so and succeeds, because a wiki that is a little out of date
        # should not turn a docs build red. The wiki is then published from a working copy with
        # `python scripts/build_wiki.py --push`, which uses that machine's own git credentials.
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::notice::No WIKI_TOKEN secret, so the wiki was not updated. Run 'python scripts/build_wiki.py --push' to publish it."
            exit 0
          fi
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-repo
          # Everything except .git is replaced, so a page deleted from docs/ disappears from the
          # wiki instead of lingering as a stale copy nobody links to.
          find wiki-repo -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp wiki/*.md wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "The wiki is already up to date."
          else
            git commit -m "docs: sync from ${{ github.sha }}"
            git push
          fi
