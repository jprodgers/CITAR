# The strict configuration: it applies to citar-engine and citar-testkit. The I/O crates
# (citar-refcheck, citar-bench, xtask) carry their own relaxed clippy.toml, which replaces this one.
# DESIGN.md sections 2.5 and 7.5 say why each entry is here.

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order differs between maps: use base::collections::DetMap, or LookupMap when you only look up" },
    { path = "std::collections::HashSet", reason = "iteration order differs between sets: use base::collections::DetSet, BitSet or IdSet" },
    { path = "std::collections::BinaryHeap", reason = "ties pop in an unspecified order: use base::collections::MinHeap, which breaks ties by push order" },
    { path = "std::hash::RandomState", reason = "seeded per process, so two identical games could diverge" },
    { path = "std::time::Instant", reason = "the engine has no clock: a game must not depend on how fast it runs" },
    { path = "std::time::SystemTime", reason = "the engine has no clock: a game must not depend on when it runs" },
    { path = "std::fs::File", reason = "the engine does no I/O: hosts pass bytes in and take bytes out" },
    { path = "std::fs::OpenOptions", reason = "the engine does no I/O: hosts pass bytes in and take bytes out" },
    { path = "std::net::TcpStream", reason = "the engine does no I/O" },
    { path = "std::net::TcpListener", reason = "the engine does no I/O" },
    { path = "std::net::UdpSocket", reason = "the engine does no I/O" },
]

disallowed-methods = [
    # Transcendental functions: std calls the platform libm, whose last bit differs between
    # targets. base::num wraps the pinned pure-Rust libm instead.
    { path = "f64::powf", reason = "platform libm: use base::num::pow" },
    { path = "f64::powi", reason = "its rounding is unspecified across targets: use base::num::pow" },
    { path = "f64::exp", reason = "platform libm: use base::num::exp" },
    { path = "f64::exp2", reason = "platform libm: use base::num (libm)" },
    { path = "f64::exp_m1", reason = "platform libm: use base::num (libm)" },
    { path = "f64::ln", reason = "platform libm: use base::num::ln" },
    { path = "f64::ln_1p", reason = "platform libm: use base::num (libm)" },
    { path = "f64::log", reason = "platform libm: use base::num (libm)" },
    { path = "f64::log2", reason = "platform libm: use base::num (libm)" },
    { path = "f64::log10", reason = "platform libm: use base::num::log10" },
    { path = "f64::cbrt", reason = "platform libm: use base::num (libm)" },
    { path = "f64::hypot", reason = "platform libm: use base::num::hypot" },
    { path = "f64::sin", reason = "platform libm: use base::num::sin" },
    { path = "f64::cos", reason = "platform libm: use base::num::cos" },
    { path = "f64::tan", reason = "platform libm: use base::num (libm)" },
    { path = "f64::sin_cos", reason = "platform libm: use base::num::sin and cos" },
    { path = "f64::asin", reason = "platform libm: use base::num (libm)" },
    { path = "f64::acos", reason = "platform libm: use base::num (libm)" },
    { path = "f64::atan", reason = "platform libm: use base::num (libm)" },
    { path = "f64::atan2", reason = "platform libm: use base::num::atan2" },
    { path = "f64::sinh", reason = "platform libm: use base::num (libm)" },
    { path = "f64::cosh", reason = "platform libm: use base::num (libm)" },
    { path = "f64::tanh", reason = "platform libm: use base::num (libm)" },
    { path = "f64::asinh", reason = "platform libm: use base::num (libm)" },
    { path = "f64::acosh", reason = "platform libm: use base::num (libm)" },
    { path = "f64::atanh", reason = "platform libm: use base::num (libm)" },
    { path = "f64::mul_add", reason = "fused on some targets and not others: write a * b + c" },
    { path = "f32::powf", reason = "platform libm: use base::num::pow" },
    { path = "f32::powi", reason = "its rounding is unspecified across targets: use base::num::pow" },
    { path = "f32::exp", reason = "platform libm: use base::num::exp" },
    { path = "f32::exp2", reason = "platform libm: use base::num (libm)" },
    { path = "f32::exp_m1", reason = "platform libm: use base::num (libm)" },
    { path = "f32::ln", reason = "platform libm: use base::num::ln" },
    { path = "f32::ln_1p", reason = "platform libm: use base::num (libm)" },
    { path = "f32::log", reason = "platform libm: use base::num (libm)" },
    { path = "f32::log2", reason = "platform libm: use base::num (libm)" },
    { path = "f32::log10", reason = "platform libm: use base::num::log10" },
    { path = "f32::cbrt", reason = "platform libm: use base::num (libm)" },
    { path = "f32::hypot", reason = "platform libm: use base::num::hypot" },
    { path = "f32::sin", reason = "platform libm: use base::num::sin" },
    { path = "f32::cos", reason = "platform libm: use base::num::cos" },
    { path = "f32::tan", reason = "platform libm: use base::num (libm)" },
    { path = "f32::sin_cos", reason = "platform libm: use base::num::sin and cos" },
    { path = "f32::asin", reason = "platform libm: use base::num (libm)" },
    { path = "f32::acos", reason = "platform libm: use base::num (libm)" },
    { path = "f32::atan", reason = "platform libm: use base::num (libm)" },
    { path = "f32::atan2", reason = "platform libm: use base::num::atan2" },
    { path = "f32::sinh", reason = "platform libm: use base::num (libm)" },
    { path = "f32::cosh", reason = "platform libm: use base::num (libm)" },
    { path = "f32::tanh", reason = "platform libm: use base::num (libm)" },
    { path = "f32::asinh", reason = "platform libm: use base::num (libm)" },
    { path = "f32::acosh", reason = "platform libm: use base::num (libm)" },
    { path = "f32::atanh", reason = "platform libm: use base::num (libm)" },
    { path = "f32::mul_add", reason = "fused on some targets and not others: write a * b + c" },

    # Rounding: say which rule you mean. f64::round rounds half away from zero, Python's round()
    # rounds half to even.
    { path = "f64::round", reason = "Python's round() is half to even: use base::num::round_half_even, or round_half_away where Python wrote int(x + 0.5)" },
    { path = "f32::round", reason = "Python's round() is half to even: use base::num::round_half_even, or round_half_away where Python wrote int(x + 0.5)" },

    # Insertion order is part of the state (tables, deals, queues): these move the last entry
    # into the hole, or are the hole-filling form under another name.
    { path = "indexmap::IndexMap::remove", reason = "reorders entries ordered by insertion: use shift_remove" },
    { path = "indexmap::IndexMap::swap_remove", reason = "reorders entries ordered by insertion: use shift_remove" },
    { path = "indexmap::IndexMap::remove_entry", reason = "reorders entries ordered by insertion: use shift_remove_entry" },
    { path = "indexmap::IndexMap::swap_remove_entry", reason = "reorders entries ordered by insertion: use shift_remove_entry" },
    { path = "indexmap::IndexMap::swap_remove_full", reason = "reorders entries ordered by insertion: use shift_remove_full" },
    { path = "indexmap::IndexMap::swap_remove_index", reason = "reorders entries ordered by insertion: use shift_remove_index" },
    { path = "indexmap::IndexSet::remove", reason = "reorders entries ordered by insertion: use shift_remove" },
    { path = "indexmap::IndexSet::swap_remove", reason = "reorders entries ordered by insertion: use shift_remove" },
    { path = "indexmap::IndexSet::take", reason = "reorders entries ordered by insertion: use shift_take" },
    { path = "indexmap::IndexSet::swap_take", reason = "reorders entries ordered by insertion: use shift_take" },
    { path = "indexmap::IndexSet::swap_remove_full", reason = "reorders entries ordered by insertion: use shift_remove_full" },
    { path = "indexmap::IndexSet::swap_remove_index", reason = "reorders entries ordered by insertion: use shift_remove_index" },

    # Unstable sorts order equal keys however the toolchain's algorithm leaves them.
    { path = "slice::sort_unstable", reason = "ties land in an unspecified order: use sort, with a key that ends in an id" },
    { path = "slice::sort_unstable_by", reason = "ties land in an unspecified order: use sort_by, with a key that ends in an id" },
    { path = "slice::sort_unstable_by_key", reason = "ties land in an unspecified order: use sort_by_key, with a key that ends in an id" },
    { path = "slice::select_nth_unstable", reason = "ties land in an unspecified order: sort stably instead" },
    { path = "slice::select_nth_unstable_by", reason = "ties land in an unspecified order: sort stably instead" },
    { path = "slice::select_nth_unstable_by_key", reason = "ties land in an unspecified order: sort stably instead" },

    # No I/O, no environment, no threads. `std::process::exit` is refused by the workspace lint
    # clippy::exit instead, so a call is reported once.
    { path = "std::fs::read", reason = "the engine does no I/O" },
    { path = "std::fs::read_to_string", reason = "the engine does no I/O" },
    { path = "std::fs::read_dir", reason = "the engine does no I/O" },
    { path = "std::fs::write", reason = "the engine does no I/O" },
    { path = "std::fs::copy", reason = "the engine does no I/O" },
    { path = "std::fs::rename", reason = "the engine does no I/O" },
    { path = "std::fs::create_dir", reason = "the engine does no I/O" },
    { path = "std::fs::create_dir_all", reason = "the engine does no I/O" },
    { path = "std::fs::remove_file", reason = "the engine does no I/O" },
    { path = "std::fs::remove_dir", reason = "the engine does no I/O" },
    { path = "std::fs::remove_dir_all", reason = "the engine does no I/O" },
    { path = "std::fs::metadata", reason = "the engine does no I/O" },
    { path = "std::fs::symlink_metadata", reason = "the engine does no I/O" },
    { path = "std::fs::canonicalize", reason = "the engine does no I/O" },
    { path = "std::fs::exists", reason = "the engine does no I/O" },
    { path = "std::fs::hard_link", reason = "the engine does no I/O" },
    { path = "std::fs::read_link", reason = "the engine does no I/O" },
    { path = "std::fs::set_permissions", reason = "the engine does no I/O" },
    { path = "std::env::var", reason = "a game must not depend on the process environment" },
    { path = "std::env::var_os", reason = "a game must not depend on the process environment" },
    { path = "std::env::vars", reason = "a game must not depend on the process environment" },
    { path = "std::env::vars_os", reason = "a game must not depend on the process environment" },
    { path = "std::env::args", reason = "a game must not depend on the process environment" },
    { path = "std::env::args_os", reason = "a game must not depend on the process environment" },
    { path = "std::env::set_var", reason = "a game must not change the process environment" },
    { path = "std::env::remove_var", reason = "a game must not change the process environment" },
    { path = "std::env::current_dir", reason = "a game must not depend on the process environment" },
    { path = "std::env::set_current_dir", reason = "a game must not change the process environment" },
    { path = "std::env::current_exe", reason = "a game must not depend on the process environment" },
    { path = "std::env::temp_dir", reason = "a game must not depend on the process environment" },
    { path = "std::env::home_dir", reason = "a game must not depend on the process environment" },
    { path = "std::thread::spawn", reason = "no threads in Phase 1 (DESIGN.md 6.13): run games side by side instead" },
    { path = "std::thread::scope", reason = "no threads in Phase 1 (DESIGN.md 6.13): run games side by side instead" },
    { path = "std::thread::Builder::spawn", reason = "no threads in Phase 1 (DESIGN.md 6.13): run games side by side instead" },
    { path = "std::thread::sleep", reason = "the engine has no clock" },
    { path = "std::process::abort", reason = "hosts turn a panic into one poisoned game; aborting takes the process down" },
]

disallowed-macros = [
    # dbg! is refused by the workspace lint clippy::dbg_macro.
    { path = "std::print", reason = "the engine has no console: return the text, or emit an event" },
    { path = "std::println", reason = "the engine has no console: return the text, or emit an event" },
    { path = "std::eprint", reason = "the engine has no console: return an error" },
    { path = "std::eprintln", reason = "the engine has no console: return an error" },
]
