[[differences]]
id = "refusals-end-as-sentences"
reason = "Refusals that ended with a list (a promotion the unit cannot take, a belief that is not available) had no full stop, and a long one ran past 600 characters; Rust ends them as sentences and keeps them within 600 characters"
where = [{ group = "tool_errors", path = "calls[*].error" }]
python = "re:Available: [^.]*[^.]$"
rust = 're:Available: .*\.$'

# Package 1d-02: the views.

[[differences]]
id = "city-view-rounds-its-own-sums"
reason = "A city's food in the client view is its stats' total rounded to a tenth, and Python's total carried the rounding error of each addition (12.349999999999998 for 12.35, 4.4e-16 for 0), so a total a hair below a half rounded down, a surplus of 4e-16 food showed as 0.0 food growing the city in 5e16 turns, and one of -2e-16 showed the city as starving, with a starving alert; Rust's totals agree with Python's to 1e-6, and the view rounds them as they are"
