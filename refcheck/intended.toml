# Deliberate differences between the Rust engine and the Python reference fixtures (format v2).
#
# `cargo refcheck` (crates/citar-refcheck) compares the Rust engine's answers with the answers recorded in
# refcheck/fixtures-mini/, refcheck/fixtures-late/ and refcheck/corpus/ (see refcheck/README.md). A difference not
# explained here is unexplained: it fails the run where refcheck/enforced.toml covers it, and counts against the
# group in refcheck/ratchet.json everywhere else. Every entry is a rule the Rust engine gets right on purpose where
# the Python engine did not, or a redesign whose numbers legitimately differ. `cargo refcheck changelog` prints the
# entries as the changelog's list of rule fixes, so the reason is written for a reader of the changelog.
#
# One [[differences]] table per entry:
#
#   id      kebab-case and unique; the code that makes the fix cites it as `// refcheck: <id>`
#   reason  one line: what Python did, and what Rust does instead
#   where   the places it covers: [{ group = "...", path = "..." }, ...]
#           group: uniques, state_echo, fixed_point, tile_yields, city_stats, civs, buildable, movement, visible,
#                  combat_previews, deal_checks, tool_errors, views, briefing
#           path:  in the path grammar, matched against the whole path of a difference:
#                  .key  ["any key"]  [3]  [pid=0] (a keyed list)  [#0=12] (keyed by tuple position)
#                  [*] (any list element)  .* (any key)  .** (any depth, none included)
#   cases   optional: globs on "<case>/t<turn>" that limit it to some fixtures (default: every fixture)
#   python  optional constraints on the two values at the difference, so an entry never hides a later,
#   rust    unrelated change at the same place:
#             3, "text", [1, 2]         that value (numbers within refcheck's tolerance; 3 equals 3.0)
#             "re:^Unknown tool"        a string matching the regex (unanchored)
#             { min = 0, max = 50 }     a number within the bounds, inclusive; either may be left out
#             { eq = "re:..." }         a value, spelled out
#             { is = "null" }, { is = "absent" }
#   rule    optional: "rust_le_python", both values numbers and Rust's not above Python's. A route with fewer
#           turns than Python's (kind `better`) needs it.
#   broad   required, as true, when a path uses .* or .**: say so when an entry reaches that far
#
# An entry that explains nothing in a run that covered it (compared one of its groups on a fixture its cases
# match) is stale: a warning, and an error with --strict. `cargo refcheck suggest` prints stubs for the unexplained
# differences of a run, and `cargo refcheck explain <id>` shows what an entry explains.
#
# For example:
#
#   [[differences]]
#   id = "civ-stats-gold"
#   reason = "Python computed civ_stats_gold but never wrote it into the total; Rust does"
#   where = [{ group = "city_stats", path = "cities[*].stats.total.gold" }]
#   python = 0
#
# The entries below come before the answer modules of their groups (package 1a-07): their paths are the best
# known places, to be tightened when those groups are compared.

[[differences]]
id = "building-conditionals-read-a-filter"
reason = "Python's building conditionals (`if [x] is constructed`, `in cities with a [x]` and the rest) compared the text with building names, so `[Wonder]` or `[Culture]` never held; Rust reads the text as a building filter"
where = [
  { group = "buildable", path = "cities[*].items.*" },
]
broad = true

[[differences]]
id = "no-civ-adopted-counts-beliefs"
reason = "Python's `if no Civilization has adopted [x]` read policies only, so a belief never counted as adopted; Rust counts beliefs too"
where = [
  { group = "buildable", path = "cities[*].items.*" },
]
broad = true

[[differences]]
id = "vs-units-never-matches-a-city"
reason = "Python's `vs [x] units` shared `vs [x]`'s test, so a city matched `[All]`, `[City]` or a city filter's word there; Rust asks it about units only"
where = [{ group = "combat_previews", path = "fights[*].**" }]
broad = true

[[differences]]
id = "civilians-at-zero-health"
reason = "Python left a civilian that a ranged attack brought to 0 health on the map at 0, neither dead nor captured (combat.py:109, 806); no Rust unit is ever at 0, and one loaded at 0 keeps 1"
where = [{ group = "state_echo", path = "units[*].hp" }]
python = 0
rust = 1

# Package 1b-06: tile yields, city stats, happiness and the stats for the next turn.

[[differences]]
id = "cities-never-share-a-tile"
reason = "Python let a city work a tile a sibling city of the same owner worked, unless the tile was that sibling's own territory, so two cities could work one tile; Rust gives a worked tile to one city, and no other may work it"
where = [{ group = "city_stats", path = "cities[*].workable.**" }]
rust = { is = "absent" }
broad = true

[[differences]]
id = "marble-bonus-in-its-own-city"
reason = "Python gave a resource's `[in this city]` uniques to every city of its owner, so Marble's +15% production toward wonders held in every city; Rust gives them to the city whose improved tile provides the resource (DESIGN.md 5.12)"
where = [
  { group = "city_stats", path = "cities[*].stats.pct.production" },
  { group = "city_stats", path = "cities[*].stats.final.*.production" },
  { group = "city_stats", path = "cities[*].stats.total.production" },
  { group = "city_stats", path = "cities[*].stats.production" },
  { group = "city_stats", path = "cities[*].current.turns" },
  { group = "civs", path = "civs[*].civ_stats.production" },
  { group = "civs", path = "civs[*].stat_map.*.production" },
]
broad = true

[[differences]]
id = "religion-ties-by-founding-order"
reason = "Python broke a tie between religions with as many followers in a city by the order the religions reached it, which its dict of pressures kept; Rust keeps a city's pressures sorted and breaks the tie by the order the religions were founded, so a tied city can follow the other religion, with its follower beliefs and its owner's religious yields"
cases = [
  "duel-pangaea-normal-s1001/t200",
  "duel-pangaea-off-s1021/t280",
  "large-continents-off-s1015/t200",
  "large-continents-off-s1015/t280",
  "large-continents-raging-s1035/t280",
  "large-fractal-off-s1039/t280",
  "large-inland_sea-off-s1018/t200",
  "large-inland_sea-off-s1018/t280",
  "large-inland_sea-raging-s1038/t280",
  "large-pangaea-normal-s1016/t280",
  "small-archipelago-normal-s1007/t200",
  "small-continents-normal-s1025/t200",
  "small-continents-normal-s1025/t280",
  "small-fractal-raging-s1029/t200",
  "small-inland_sea-raging-s1008/t280",
  "standard-archipelago-off-s1012/t120",
  "standard-continents-normal-s1010/t120",
  "standard-continents-normal-s1010/t280",
  "standard-continents-off-s1030/t200",
  "standard-continents-off-s1030/t280",
  "standard-inland_sea-normal-s1013/t200",
  "standard-inland_sea-normal-s1013/t280",
  "standard-inland_sea-off-s1033/t280",
  "standard-pangaea-raging-s1011/t280",
]
where = [
  { group = "city_stats", path = "cities[*].majority" },
  { group = "city_stats", path = "cities[*].followers.**" },
  { group = "city_stats", path = "cities[*].stats.**" },
  { group = "city_stats", path = "cities[*].current.turns" },
  { group = "civs", path = "civs[*].happiness.**" },
  { group = "civs", path = "civs[*].civ_stats.**" },
  { group = "civs", path = "civs[*].stat_map.**" },
  { group = "civs", path = "civs[*].gold_per_turn.**" },
]
broad = true

[[differences]]
id = "gold-per-turn-rounds-a-sum-at-a-half"
reason = "Gold per turn is shown rounded to one place from a sum of floats taken in the order of the cities' worked tiles, which Python kept in the order it placed the citizens and Rust keeps sorted; a sum a hair from a half rounds either way"
cases = ["small-fractal-off-s1009/t280"]
where = [{ group = "civs", path = "civs[*].gold_per_turn.*" }]
broad = true
