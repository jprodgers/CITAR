# The refcheck groups whose unexplained differences fail a run (crates/citar-engine/DESIGN.md 9.2).
#
# CI runs `cargo refcheck run` on refcheck/fixtures-mini and refcheck/fixtures-late: an unexplained difference
# (one refcheck/intended.toml does not explain) at a place listed here fails it. Elsewhere, unexplained
# differences are reported and counted in refcheck/ratchet.json, where they may only fall.
#
# Every system package that brings an answer module adds its group here, or the paths it has made clean
# (DESIGN.md 3.4, rule 1). A group listed here must have an answer module; enforcing a group that is never
# compared would pass without checking anything, so the run stops with a configuration error instead.
#
#   [[enforce]]
#   group = "tile_yields"                  # the whole group
#
#   [[enforce]]
#   group = "civs"                         # only these paths, in the path grammar of intended.toml,
#   paths = ["civs[*].resource_supply.**", "civs[*].unit_supply"]   # matched against a difference's whole path
#
# A difference above an enforced path that hides it counts too: an answer module that failed, a missing or extra
# civilization (or any value holding an enforced place), a `civs` list that could not be keyed by pid.
#
# uniques (package 1a-05): every unique text of the ruleset compiles as Python read it.
[[enforce]]
group = "uniques"

# state_echo (package 1a-10): each fixture's state reads back from its conversion, field by field (every
# persisted field the converter keeps; what its report drops aside).
[[enforce]]
group = "state_echo"

# tile_yields (package 1b-06): what every owned tile yields to its owner as its own city works it, and a
# sample of unowned tiles as nobody and a civilization see them.
[[enforce]]
group = "tile_yields"

# city_stats (package 1b-06): each city's stats breakdown with Python's keys, its food to the next citizen,
# maintenance, health, strength, the tiles it could work, its trade route and the turns to build what it
# builds. Its religion paths (followers, majority, pressure_in) wait for package 1b-08.
[[enforce]]
group = "city_stats"
paths = [
  "cities",
  "cities[*].id",
  "cities[*].owner",
  "cities[*].name",
  "cities[*].stats.**",
  "cities[*].food_to_next_pop",
  "cities[*].maintenance",
  "cities[*].max_health",
  "cities[*].strength",
  "cities[*].workable.**",
  "cities[*].connected_to_capital",
  "cities[*].current.**",
]

# civs (package 1b-05): the civilization-level data it ports. Its resources, line by line and net; the unique
# index by placeholder; unit upkeep and unit supply; and the era the index is built with. Package 1b-06 adds
# happiness, the stats for the next turn by source and in total, and gold per turn. The group's other paths
# wait for their packages (costs and policies 1b-07; score and victory 1c-08).
[[enforce]]
group = "civs"
paths = [
  "civs[*].resource_supply.**",
  "civs[*].detailed_resources.**",
  "civs[*].unique_index.**",
  "civs[*].unit_maintenance",
  "civs[*].unit_supply",
  "civs[*].era",
  "civs[*].happiness.**",
  "civs[*].civ_stats.**",
  "civs[*].stat_map.**",
  "civs[*].gold_per_turn.**",
]
