# Switches for `cargo xtask check` that later packages turn on (DESIGN.md 3.4, rules 3 and 4).

[pending]
# Packages whose gates have passed. A stage still written as Pending("<package>") for one of
# these fails the check: once a package is done, every stage it owns must be real.
done = ["P1-00", "1a-01", "1a-02", "1a-03", "1a-04", "1a-05", "1a-05b", "1a-06", "1a-07", "1a-08", "1a-09", "1a-10", "1b-01", "1b-02", "1b-03", "1b-04", "1b-05", "1b-06", "1b-07", "1b-08", "1c-01", "1c-02"]
# From 1c-10 on, any Pending stage at all fails.
forbid_all = false

[not_ported]
# From 1e-04 on, any NotPorted error fails.
forbid = false
