# nginx site for citar.example.com
#
# A NEW file in sites-available. It touches nothing belonging to the resume site, the forum or the
# oven-tuner app — those keep their own server blocks, and this one only answers to its own
# server_name.
#
# Installed initially as HTTP-only so certbot can complete the ACME challenge; certbot then adds the
# listen 443 / ssl_certificate lines itself, exactly as it already did for the other two sites.

upstream citar_app {
    server 127.0.0.1:8765 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name citar.example.com;

    # Generous, because a game upload or a scenario can be large, but not unbounded.
    client_max_body_size 32m;

    access_log /var/log/nginx/citar.access.log;
    error_log  /var/log/nginx/citar.error.log;

    # Let the app decide caching for its own routes; only the ACME path is special.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The live game feed and the worker agent both hold a websocket open for hours at a time.
    # Without the Upgrade headers nginx turns the handshake into a plain 200 and the client sits
    # there waiting; without the long read timeout it severs a quiet connection after 60 seconds.
    location /ws/ {
        proxy_pass http://citar_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://citar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # CITAR reads the client address from the END of this header, trusting exactly one hop
        # (CITAR_TRUSTED_PROXY_HOPS=1). That is what makes per-IP rate limiting real rather than
        # decorative: trusting the leftmost entry would let anyone set their own apparent IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # A turn on a 24-civ map, or an LLM seat waiting on a slow local model, can legitimately
        # take minutes. The app's own long-poll endpoints cap at 300s.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;

        # Server-sent updates and long polls must not be held in a buffer.
        proxy_buffering off;
    }
}
