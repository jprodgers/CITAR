# Alembic configuration for CITAR.
#
# The database URL is deliberately NOT set here: migrations/env.py reads it from citar.settings, so
# the same commands work against the local SQLite file and the VPS deployment without editing a
# checked-in file (and without a password ever landing in the project folder).
#
#   python -m alembic upgrade head                 apply migrations
#   python -m alembic revision --autogenerate -m "what changed"
#   python -m alembic current / history            where are we
#
# CITAR also applies migrations itself at startup, so a deploy does not depend on remembering this.

[alembic]
script_location = citar/migrations
prepend_sys_path = .
version_path_separator = os
# Migration filenames sort chronologically, which makes the history readable in a directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
