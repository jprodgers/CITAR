# maturin builds the package with its Rust extension, citar._engine (crates/citar-py), so building
# from source needs a Rust toolchain: rust-toolchain.toml pins it, and rustup installs it on first
# use. crates/citar-engine/DESIGN.md P2.6.7 is the design.
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "citar"
# Cargo's: [workspace.package] version in Cargo.toml, which cargo xtask check holds equal to
# __version__ in citar/__init__.py.
dynamic = ["version"]
description = "Civ Inspired Tool for AI Research - a Civilization V-style 4X game for benchmarking language models"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
authors = [{ name = "Jimmie Rodgers" }]
keywords = [
    "llm", "benchmark", "agents", "evaluation", "game", "4x", "civilization",
    "mcp", "ai-research", "strategy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The floor for everything CITAR needs to start, play a game, and run a public server. Optional
# provider clients live in the extras below: a home user playing against local models should not
# have to install the Anthropic SDK, and a headless benchmark box should not need Authlib.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",          # argon2id password hashing
    "itsdangerous>=2.2",          # signed one-shot tokens
    "python-multipart>=0.0.9",    # form posts on the auth screens
    "email-validator>=2.1",
    "tzlocal>=5.2",               # the machine's IANA zone, for availability windows
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.40"]
mcp = ["mcp>=2.0"]
oauth = ["Authlib>=1.3"]                     # Google, GitHub, Discord, Microsoft sign-in
keyring = ["keyring>=25.0", "cryptography>=42.0"]   # OS credential store for API keys
worker = ["websockets>=12.0"]                # the outbound worker agent
postgres = ["psycopg[binary]>=3.1"]

# Everything a person would want on a workstation.
all = [
    "citar[anthropic,openai,mcp,oauth,keyring,worker]",
]
# What a public deployment needs, without the local-model client libraries.
server = [
    "citar[anthropic,oauth,keyring,worker]",
]
dev = [
    "citar[all]",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.1",
    "pip-audit>=2.7",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/jprodgers/CITAR"
Documentation = "https://github.com/jprodgers/CITAR/wiki"
Source = "https://github.com/jprodgers/CITAR"
Issues = "https://github.com/jprodgers/CITAR/issues"
Changelog = "https://github.com/jprodgers/CITAR/blob/main/CHANGELOG.md"

[project.scripts]
citar = "citar.cli:main"
citar-admin = "citar.server.admin_cli:main"
citar-worker = "citar.worker.__main__:main"
citar-mcp = "citar.agents.mcp_server:main"

# --------------------------------------------------------------------------------- build

[tool.maturin]
# The mixed layout: the Python package is ./citar, and the extension goes into it as
# citar/_engine (DESIGN.md P2.6.7). The wheel holds the package and the extension, nothing else
# from the root.
python-source = "."
module-name = "citar._engine"
manifest-path = "crates/citar-py/Cargo.toml"
# Never `test-ops`: no wheel carries the engine's test operations, and cargo xtask check refuses
# a feature list that would turn them on (or the converter's `legacy`). The Python suite's builds
# add it themselves: CI's build-ext job and `cargo xtask develop` pass --features test-ops.
# maturin sets the extension-module build itself.
features = []
# No `locked = true`, though CI builds with --locked: the source distribution keeps only the five
# crates the extension needs, so cargo prunes the other members' packages from its Cargo.lock
# (the versions it keeps are unchanged), which --locked refuses.
# `pip install -e .`, a working copy's build: the ci profile, which every Rust test uses (release
# optimisation without fat LTO, debug assertions on), so it builds in a fraction of the release
# profile's time and still trips the engine's assertions. A wheel (`pip install .`, `maturin
# build`) is a release build.
editable-profile = "ci"
# Data that must reach an installed copy: the browser client, the migration environment, and the
# hardware collectors offered for download on the Servers page. The package folder travels whole,
# less what .gitignore and `exclude` leave out; these are named so that an ignore rule can never
# drop them. The ruleset is no file of the package: the engine compiles it in from
# crates/citar-engine/data/, which the source distribution carries with the crate.
include = [
    { path = "citar/data/collectors/*", format = ["sdist", "wheel"] },
    { path = "citar/web/**/*", format = ["sdist", "wheel"] },
    { path = "citar/migrations/**/*.py", format = ["sdist", "wheel"] },
    { path = "citar/migrations/**/*.mako", format = ["sdist", "wheel"] },
    # The source distribution builds the wheel with the pinned toolchain and runs the Python suite:
    # beside the package and the five crates maturin takes, the tests, the scripts they run and
    # refcheck's committed answers (never its local corpus), and the documents and deployment files
    # a source release has always carried.
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "tests/**/*", format = "sdist" },
    { path = "scripts/**/*", format = "sdist" },
    { path = "refcheck/intended.toml", format = "sdist" },
    { path = "refcheck/query_tools.json.gz", format = "sdist" },
    { path = "refcheck/fixtures-mini/**/*", format = "sdist" },
    { path = "refcheck/fixtures-late/**/*", format = "sdist" },
    { path = "docs/**/*", format = "sdist" },
    { path = "deploy/**/*", format = "sdist" },
    { path = "installer/**/*", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "DESIGN.md", format = "sdist" },
    { path = "alembic.ini", format = "sdist" },
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/.DS_Store",
    # The installers' build output, which the include above would take: maturin's include globs
    # match the files on disk, not git's index.
    { path = "installer/output/**/*", format = "sdist" },
    { path = "installer/build/**/*", format = "sdist" },
]

# --------------------------------------------------------------------------------- lint

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["citar/migrations/versions"]

[tool.ruff.lint]
# Rules that find mistakes, not rules that find differences of opinion.
#
# The wider default sets were tried and rejected. `UP045`/`UP037`/`UP006` alone wanted 1,300 edits
# to rewrite `Optional[X]` as `X | None` and unquote annotations, and `I001` wanted to reorder the
# imports of every module — all of it mechanical, none of it a bug, and a 63,000-line diff through
# an engine is a poor trade for a stylistic preference. The codebase is internally consistent as it
# stands, which is the property that actually matters.
#
# So: pyflakes (unused and undefined names), the pycodestyle checks that catch real errors,
# bugbear (mutable defaults, loop-variable capture in closures, bare except), comprehension
# misuse, and a couple of RUF rules for hygiene.
select = [
    "E4",     # imports: shadowed, misplaced
    "E7",     # statement errors: comparisons to None/True, lambda assignment
    "E9",     # syntax and IO errors
    "F",      # pyflakes
    "B",      # bugbear
    "C4",     # comprehensions
    "RUF100", # noqa comments that no longer suppress anything
]
ignore = [
    "B008",   # FastAPI's Depends() in a default argument is the framework's own idiom
    "B011",   # assert False is used in tests to mark unreachable paths

    # `raise X from exc`. Worth having where the cause is interesting, and CITAR's API layer
    # deliberately does the opposite: `except ServerError as e: raise HTTPException(400, str(e))`
    # converts an internal error into an HTTP status, and chaining the original would put an
    # internal traceback into a response body. Where the cause does matter, the code chains
    # explicitly.
    "B904",

    # Unused loop variables. The engine iterates over `(index, tile)` and similar pairs constantly
    # and uses one half; renaming those to `_tile` throughout would be 32 edits that make the code
    # marginally harder to read to satisfy a linter.
    "B007",

    # `zip(..., strict=True)`. Correct advice in general; here the zipped sequences are built one
    # from the other a line or two above, so a length mismatch is not a thing that can happen, and
    # `strict=` on every call site is noise.
    "B905",

    # Section-local imports. app.py imports `copy`, `secrets` and `threading` at the top of the
    # scenario-editor section rather than at the top of a 900-line module, which keeps each
    # section's dependencies visible. The module is not import-order sensitive.
    "E402",

    # `a.clear(); b += 1` on one line. Used in the engine for pairs of statements that are one
    # thought (invalidate a cache and bump its generation), in code that is read as a block.
    "E702",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]                  # tests import `tests` first, on purpose
"citar/migrations/env.py" = ["E402"]  # sys.path is set up before the package imports

[tool.ruff.lint.isort]
known-first-party = ["citar"]
