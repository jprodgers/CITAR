[package]
name = "citar-bot"
description = "The CITAR bots: compiled versions (basic-1, idle) that play seats as the engine's SeatDrivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# cargo xtask check: the bot depends on no workspace crate but the engine, and turns on neither of
# its test-only features (`legacy`, `test-ops`), since it ships in the wheel and the helper
# (DESIGN.md P2.2).
[dependencies]
citar-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
blake3.workspace = true
thiserror.workspace = true

# build.rs hashes the sources and the parameter schemas into CITAR_BOT_CODE (DESIGN.md P2.2.1).
[build-dependencies]
blake3.workspace = true

[dev-dependencies]
# The shipped ruleset, for the build id's tests.
citar-engine = { workspace = true, features = ["embedded-ruleset"] }

[lints]
workspace = true
