[package]
name = "citar-jobs"
description = "CITAR's CPU jobs: the job vocabulary, the lab game, hashes, claims and the job host, shared by the helper and the server (design/phase4-helper.md P4.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The `burn` and `alloc` job kinds the limit tests use (4-08). cargo xtask check refuses it in
# every shipped build, as it refuses the helper's test features.
test-jobs = []

# cargo xtask check: the engine, the bot and the runner (P4.3.1), the engine with no test-only
# feature, since the helper ships it. A job is the engine's ordinary game played by the runner,
# so both sides of the wire compute one result from one spec with this crate's code.
[dependencies]
citar-engine = { workspace = true, features = ["embedded-ruleset"] }
citar-bot.workspace = true
citar-sim.workspace = true
serde.workspace = true
serde_json.workspace = true
# The spec, result and jobs-build hashes; the chain is the engine's (DESIGN.md 4.10); the keyed
# sample of which results a replica checks (P4.5.8).
blake3.workspace = true
# A run's claim, signed by the helper's machine key and verified by the server against the key the
# machine registered (P4.4.4): ed25519, the signatures and keys in standard base64 as the frames
# carry them.
ed25519-dalek.workspace = true
base64.workspace = true
thiserror.workspace = true
# A run's CPU time, reported beside its result and never hashed: the thread's that played it.
cpu-time.workspace = true
# The update manifest's versions (P4.3.8): a helper never takes an older or the same one, and
# the server pushes a manifest only to helpers older than it; semver orders pre-releases.
semver.workspace = true

[target.'cfg(windows)'.dependencies]
# The owner-only DACL of the helper's machine key (P4.3.7), written and read back: the security
# descriptor calls, the process token's user, and LocalFree for what they allocate; and the job
# host's limits (P4.3.6): the Job Object it puts itself in, its priority class, and its own
# committed memory, which the Job Object's limit counts beside its runs'. And the helper's
# Windows service (P4.3.9, 4-14): whether the process is elevated, the service home's DACL, and
# the service manager's entry (the dispatcher, the control handler and the status it reports).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# The job host's limits (P4.3.6): setpriority, RLIMIT_DATA, and on macOS the resident size.
libc.workspace = true

# build.rs hashes the sources and the golden set into CITAR_JOBS_CODE, which the jobs build covers
# (P4.4.5).
[build-dependencies]
blake3.workspace = true

[dev-dependencies]
# The specs' robustness: mutated specs never panic the parser (tests/specs.rs, P4.6).
proptest.workspace = true
# The `jobs` golden set's own test binary (tests/golden.rs): its jobs by name, and a child mode
# that plays one in a second process; the job host's (tests/host.rs), whose children are hosts.
libtest-mimic.workspace = true
# The host tests' check that a host whose parent died left no process, by its pid.
sysinfo.workspace = true

# The `jobs` golden set (P4.4.5), with its own harness: run it in the ci and the release
# profiles (`cargo nextest run -p citar-jobs`, and with `--cargo-profile release`).
[[test]]
name = "golden"
harness = false

# The job host and its limits per OS (4-08), with the test jobs (`burn`, `alloc`): its own
# harness, since the binary is also the host its tests start (and their parent, for the test of a
# parent that dies), with the counting allocator a host has.
[[test]]
name = "host"
harness = false
required-features = ["test-jobs"]

[lints]
workspace = true
