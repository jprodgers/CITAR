[package]
name = "citar-bench"
description = "Benchmarks of the CITAR engine: criterion wall clock and gungraun instruction counts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# test-ops: Game::step_unit_for_test, a unit's step (package 1c-01), and Game::settle_for_bench, the
# settle with nothing pending (package 1b-06).
citar-engine = { workspace = true, features = ["embedded-ruleset", "legacy", "test-ops"] }
# The synthetic states the save and digest benchmarks time.
citar-testkit.workspace = true

[dev-dependencies]
criterion.workspace = true
# The scenario operations the stats benchmarks set their states up with.
serde_json.workspace = true

# The digest and the save of a synthetic gargantuan state (package 1a-09): the digest is gated at
# 5 ms (report-only) and fails the run above 15 ms (DESIGN.md 4.10, 10).
[[bench]]
name = "digest"
harness = false

# Map generation (package 1b-04): a small map is budgeted at 50 ms and a gargantuan one at 1.5 s
# (report-only); the run fails above three times either (DESIGN.md 9.7).
[[bench]]
name = "mapgen"
harness = false

# The unique indexes of a civilization (package 1b-05): a lookup at 20 ns and a rebuild at 10 us
# (report-only), failing above three times either.
[[bench]]
name = "index"
harness = false

# Visibility (package 1c-01): one unit step at sight 2 with its sight brought up to date, budgeted at
# 1.5 us, and line of sight at sight 3 worked out uncached, at 1 us (report-only); the run fails
# above three times either.
[[bench]]
name = "vis"
harness = false

# Tile yields, city stats, citizens, connectivity and settle (package 1b-06): a tile yield hit at
# 5 ns, its first read after an unrelated change at 50 ns and a recompute at 1 us; city stats at
# 10 us; a city of 20's citizens at 10 us; connectivity on a small map at 30 us; a settle with
# nothing pending at 0.5 us (report-only), failing above three times any.
[[bench]]
name = "stats"
harness = false

# What a city can build (package 1b-07): the Buildable memo read at 50 ns and recomputed at 20 us
# (report-only), failing above three times either.
[[bench]]
name = "buildable"
harness = false

[lints]
workspace = true
