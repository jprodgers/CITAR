[package]
name = "citar-bench"
description = "Benchmarks of the CITAR engine: criterion wall clock and gungraun instruction counts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
citar-engine = { workspace = true, features = ["embedded-ruleset", "legacy"] }
# The synthetic states the save and digest benchmarks time.
citar-testkit.workspace = true

[dev-dependencies]
criterion.workspace = true

# The digest and the save of a synthetic gargantuan state (package 1a-09): the digest is gated at
# 5 ms (report-only) and fails the run above 15 ms (DESIGN.md 4.10, 10).
[[bench]]
name = "digest"
harness = false

# Map generation (package 1b-04): a small map is budgeted at 50 ms and a gargantuan one at 1.5 s
# (report-only); the run fails above three times either (DESIGN.md 9.7).
[[bench]]
name = "mapgen"
harness = false

[lints]
workspace = true
