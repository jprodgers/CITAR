# ---- pass rounds -----------------------------------------------------------------------------
# `turns` records `turn/pass_round/<case>/t<turn>` for every corpus state (the committed ones
# without the corpus): the median of rounds each passed on a fresh copy of the state after one
# untimed round, as turn_timing.py times Python's.

[pass_round]
# Every corpus state at least this many times faster than Python's round.
ratio = 20.0

# Hard backstops, whatever Python took.
[[pass_round.backstop]]
case_prefix = "small-"
turn = 280
budget = "150 ms"

[[pass_round.backstop]]
case_prefix = "large-"
turn = 280
budget = "400 ms"

# The target budgets, in milliseconds at turns 50, 150 and 300 (interpolated between, held
# beyond), hard at `hard` times like every budget.
[[pass_round.target]]
case_prefix = "small-"
points = [[50, 2.0], [150, 8.0], [300, 20.0]]

[[pass_round.target]]
case_prefix = "gargantuan-"
points = [[50, 40.0], [150, 150.0], [300, 350.0]]
