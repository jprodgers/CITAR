# The performance budgets of crates/citar-engine/DESIGN.md 10 and P2.4.2, one per measure the
# suites record (citar-bench: benches/kernels, turns.rs, io.rs, games.rs). From package 1e-03 on
# they are hard: a measure above `hard` times its budget fails its suite and `cargo xtask perf`,
# unless its row is `report_only` (the games rows, until package 2-07).
#
# Figures are for one P-core of the laptop (i5-13420H), the bench profile (release: fat LTO, one
# codegen unit, no overflow checks), on corpus states where a row names one. Each suite takes the
# median of its own timings after Criterion's run and writes it to <target>/perf/<suite>.json;
# perfgate checks every budget below against those files, and the pass rounds against Python's
# (refcheck/perf/python-turns.json, from scripts/refcheck/turn_timing.py).

hard = 1.5

