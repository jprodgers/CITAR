# Relaxed: this is a host crate (design/phase4-helper.md P4.3). It talks to a server and a model
# endpoint, reads and writes its home and keeps time, so it replaces the strict root clippy.toml
# (clippy uses the nearest file and does not merge them). The workspace lints in Cargo.toml still
# apply, including iter_over_hash_type. Nothing in this crate decides a game: the engine and the
# bot do, under the strict rules.
