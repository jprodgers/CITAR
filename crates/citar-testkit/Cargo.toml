[package]
name = "citar-testkit"
description = "Every integration test of the CITAR engine: rule scripts, properties, goldens, agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
citar-engine = { workspace = true, features = ["embedded-ruleset", "legacy", "test-ops"] }
serde.workspace = true
# raw_value: a fixture's state is handed to the converter as the text Python wrote.
serde_json = { workspace = true, features = ["raw_value"] }
blake3.workspace = true
# The refcheck fixtures are gzipped.
flate2.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
