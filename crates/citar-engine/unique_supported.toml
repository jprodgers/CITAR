# The unique types the engine supports: every type the Python engine handled, which is every type
# the shipped ruleset uses and more (crates/citar-engine/DESIGN.md 5.4, "support scope").
# `cargo xtask gen-uniques` reads this file with unique_types.tsv and writes src/unique/gen.rs, and
# `cargo xtask check` fails while gen.rs is stale.
#
# `# (extra)` marks the 125 types the shipped ruleset does not use. The kitchen-sink test ruleset
# (crates/citar-testkit/testdata/rulesets/kitchen_sink/) uses each of them, and a test holds the two
# rulesets together to every type listed here, so a test can reach any of them.
#
# A ruleset unique of a type not listed here does not load: the error names the type and says to
# add it here, then an arm where its stages read it, then a test.
#
# One entry per type, keyed by its name in unique_types.tsv:
#
#   role     What the engine does with it.
#              effect       a standing modifier, read through the unique indexes, conditionals and all
#              flag         a standing yes or no, read by presence; it has no parameters
#              requirement  gates the object that carries it: buildable, researchable, adoptable
#              one_time     happens once: when its source is gained, when its trigger fires, or as a
#                           unit action when it carries action modifiers (triggers.py TRIGGERABLE)
#              action       a unit action, which action modifiers limit
#              ai           a weight for the AI's choices; never changes a rule
#              mapgen       read by map generation only, and never in a unique index
#              inert        compiled and checked, then read by nothing; `reason` says why
#              cond         a conditional modifier: <when attacking>
#              trigger      says when a one-time effect fires: <upon discovering [Writing] technology>
#              action_mod   limits a unit action: <by consuming this unit>, <[2] times>
#              meta         changes the unique itself: <(modified by game speed)>, <for [10] turns>;
#                           or only how it is shown, which the engine ignores: <hidden from users>
#   fields   One name per parameter, in order: the payload's field names. `name:kind` overrides
#            the kind unique_types.tsv gives; the one override is `amount16`, an amount stored in
#            16 bits so that a payload stays within 12 bytes (DESIGN.md 5.5).
#   gain     Also happens once when its source is gained, besides standing (triggers.py
#            TRIGGERABLE): free buildings, free promotions.
#   stages   The engine systems that read it: the Python modules that did (`U.<name>` or the
#            placeholder itself), as the game modules of DESIGN.md 3.2 that replace them. The
#            package that ports a system handles every type that names it.
#              actions, ai (the bot), api (tools, views, briefing), automation, barbarians, cities,
#              city_states, combat, conquest, diplomacy, economy, espionage, great_people, mapgen,
#              movement, policies, religion, research, rules (rules::derived), ruins, setup,
#              tiles, triggers, turn, unique (conditionals and filters), units, victory, vis,
#              workers
#   reason   For an inert type: why nothing reads it.

