# The Rust side of CITAR: the engine and the tools that test and measure it.
# crates/citar-engine/DESIGN.md is the design; section 2 covers this file.

[workspace]
resolver = "3"
members = [
    "crates/citar-engine",
    "crates/citar-bot",
    "crates/citar-store",
    "crates/citar-sim",
    "crates/citar-py",
    "crates/citar-helper",
    "crates/citar-jobs",
    "crates/citar-testkit",
    "crates/citar-refcheck",
    "crates/citar-bench",
    "xtask",
]
exclude = ["crates/citar-engine/fuzz"]

[workspace.package]
# cargo xtask check: this must equal __version__ in citar/__init__.py, so a release bumps both.
version = "0.1.5"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
citar-engine  = { path = "crates/citar-engine", default-features = false }
# Without its `checks` feature, which the testkit crate's own builds turn on by default, so that
# `cargo bench -p citar-bench` compiles no check. A command that also selects testkit (a plain
# `cargo bench` at the root) unifies the feature back on, so each benchmark's game also turns its
# checks off (`citar_bench::unchecked`, DESIGN.md 9.4).
citar-testkit = { path = "crates/citar-testkit", default-features = false }
# Phase 2 (DESIGN.md P2.2): cargo xtask check holds each crate to its row of the crate graph.
citar-bot     = { path = "crates/citar-bot" }
citar-store   = { path = "crates/citar-store" }
citar-sim     = { path = "crates/citar-sim" }
# Phase 4 (design/phase4-helper.md P4.3.1, P4.4): created holding only its `sys` module (4-03).
citar-jobs    = { path = "crates/citar-jobs" }
# engine (the xtask allow-list: exactly these, plus their transitive closure)
serde        = { version = "1.0.229", features = ["derive"] }
serde_json   = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
indexmap     = { version = "2.14", features = ["serde"] }
rustc-hash   = "2.1"
smallvec     = { version = "1.15", features = ["union", "const_generics", "serde"] }
# Exact pin, and no `arch` feature: its hardware sqrt/fma/rint are correctly rounded anyway, but
# turning them off means no libm bump ever has to re-argue that. A bump re-blesses the goldens.
libm         = { version = "=0.2.16", default-features = false }
blake3       = { version = "1.8", default-features = false, features = ["std", "pure"] }
thiserror    = "2.0"
base64       = "0.23"
aho-corasick = "1.1"
bitflags     = "2.13"
# hosts: the store, the runner and the bindings (DESIGN.md P2.2)
# 0.13, MIT: 0.14 moved to BSD-3-Clause. No default features: neither legacy zstd formats nor
# dictionaries are read or written.
zstd = { version = "0.13", default-features = false }
# One abi3 extension per OS for Python 3.11 and up (DESIGN.md P2.6.1). PyO3 0.29 links Windows
# through raw-dylib and deprecated `generate-import-lib`, which is no longer needed.
pyo3 = { version = "0.29", features = ["abi3-py311"] }
# citar-py's build script: the extension's link arguments on macOS (crates/citar-py/build.rs).
pyo3-build-config = "0.29"
# The baseline writer's `cpu_s`: the CPU time of the thread that played a game (citar-sim), as
# Python's `time.process_time()` gave its worker process's. Safe wrappers over GetThreadTimes and
# clock_gettime, so citar-sim keeps `forbid(unsafe_code)`; libc and winapi are already locked.
cpu-time = "1.0"
# The helper (design/phase4-helper.md P4.3.1). One tokio runtime; its features are each crate's.
tokio = { version = "1.53", default-features = false }
# The WebSocket over a stream the helper dials itself (TCP, then rustls for wss), so the TLS
# configuration and the development guard's loopback check are the helper's own. 0.29, not 0.30:
# 0.30's rand 0.10 turns on getrandom 0.4's rand_core, and the engine's and the bot's content
# codes follow the lock to getrandom 0.4 (blake3's build dependency cc, through jobserver), so it
# would move the build id with nothing in a game changed; citar-bot's lock test catches that.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# TLS with ring, not aws-lc-rs: no CMake or NASM on any target, the same C toolchain the
# workspace already builds zstd with. The OS's own trust store verifies (no CA bundle hunt as the
# Python worker did), plus `--ca-file` for a self-signed server.
rustls = { version = "0.23.43", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"
rustls-pki-types = { version = "1.15", features = ["std"] }
# The model endpoint's HTTP for discovery (4-03), on the same rustls, with no system proxy: the
# helper dials only its configured endpoint.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# The proxy's completions (4-04): HTTP/1.1 on a connection the request's own task dials and
# drives, so dropping the request closes the socket in that drop, before `cancelled` is sent (real
# cancel, P4.3.4), with no pool to keep or reuse a cancelled generation's connection. Both are
# already in the lock through reqwest, with these features.
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
# The machine key (P4.3.7): ed25519 from the OS's random source.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.3"
# The machine's name, logical CPUs and memory (the local CPU ceiling's defaults; the scan, 4-06).
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Local quiet hours: the machine's own time zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# citar-jobs' sys module only (the owner-only DACL of the machine key, P4.3.7; the job limits,
# 4-08): the one place Phase 4 calls the OS without a safe wrapper.
windows-sys = "0.61"
# The same module on Unix (the job limits, 4-08: setpriority, RLIMIT_DATA, macOS's resident size).
libc = "0.2.189"
# tools and tests only
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
toml = "1.1"
globset = "0.4"
similar = "3.2"
rayon = "1"
# The `re:` value constraints of refcheck/intended.toml. globset already builds its engine.
regex = "1.13"
libtest-mimic = "0.8"
proptest = { version = "1.11", default-features = false, features = ["std"] }
arbitrary = "1.4"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
gungraun = "0.19"         # the successor of iai-callgrind
# The criterion suites pin their thread to one core (DESIGN.md 9.7).
core_affinity = "0.8"

[workspace.lints.rust]
unsafe_code = "deny"
# A dropped `Change` is a write whose revision bump was lost (DESIGN.md section 6.4).
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# unused_must_use sees only a bare `g.set_x();`. This adds `let _ = g.set_x();`. `_ = ...`,
# `let _x = ...` and `drop(...)` still get past both, so they are review items (README.md).
let_underscore_must_use = "deny"
# Hash order differs between two maps in one process, so iterating one can fork a game.
iter_over_hash_type = "deny"
float_cmp = "warn"
lossy_float_literal = "warn"
mem_forget = "deny"
# Hosts turn a panic into one poisoned game; exiting takes the whole process with it.
exit = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
opt-level = 1                      # whole-game tests are 10-30x slower at 0

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]                  # ships: wheel extension, helper, citar-sim
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"                   # never abort: hosts turn a panic into one poisoned game
# Off: the 1e-03 bench report measured 5-9% on pass rounds (DESIGN.md 10, "As built in 1e-03"),
# over the 3% the design allowed. The ci profile, which every test, golden and chaos run uses,
# keeps them, so an overflow still fails a test.
overflow-checks = false

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = false
debug-assertions = true
overflow-checks = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
